<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Midas Project Room</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#090d0c}
canvas{display:block}
#hud{
  position:fixed;left:14px;bottom:12px;z-index:10;
  padding:7px 10px;border:1px solid rgba(205,180,111,.28);
  border-radius:4px;background:rgba(7,12,11,.78);
  color:#d6c691;font:11px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.05em;box-shadow:0 6px 24px rgba(0,0,0,.3);
  backdrop-filter:blur(5px);pointer-events:none
}
#hint{
  position:fixed;right:14px;bottom:12px;z-index:10;
  color:rgba(220,226,206,.52);font:10px/1.2 ui-monospace,monospace;
  background:rgba(7,12,11,.5);padding:6px 8px;border-radius:3px;
  pointer-events:none
}
</style>
</head>
<body>
<div id="hud">Midas · generated by openai/gpt-5.6-sol</div>
<div id="hint">WASD / arrows · pan &nbsp; Q/E · rotate &nbsp; drag · orbit</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x090e0d);
  scene.fog = new THREE.FogExp2(0x0b1110, 0.018);

  const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:"high-performance"});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.18;
  document.body.appendChild(renderer.domElement);

  const camera = new THREE.OrthographicCamera(-16,16,10,-10,0.1,120);
  const target = new THREE.Vector3(0,1.15,0);
  let yaw = Math.PI / 4;
  const horizontalRadius = 27;
  const elevation = THREE.MathUtils.degToRad(52);

  function updateCamera(){
    camera.position.set(
      target.x + Math.sin(yaw) * horizontalRadius,
      target.y + Math.tan(elevation) * horizontalRadius,
      target.z + Math.cos(yaw) * horizontalRadius
    );
    camera.lookAt(target);
    camera.updateMatrixWorld();
  }
  function resize(){
    const aspect = innerWidth / innerHeight;
    const viewH = 21.5;
    camera.left = -viewH * aspect / 2;
    camera.right = viewH * aspect / 2;
    camera.top = viewH / 2;
    camera.bottom = -viewH / 2;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  }
  resize();
  updateCamera();
  addEventListener("resize", resize);

  const C = {
    walnut:0x241712, walnut2:0x3a251a, walnut3:0x563624,
    brass:0xb08a3d, brassDark:0x685029, green:0x2b4a3e,
    greenDark:0x13231f, cream:0xc9c2a8, black:0x080c0c,
    screen:0x65d5a7, red:0xd56b5c, blue:0x79b9c0
  };

  const mat = (color, rough=.7, metal=.05, emissive=0x000000, intensity=0) =>
    new THREE.MeshStandardMaterial({color, roughness:rough, metalness:metal, emissive, emissiveIntensity:intensity});

  const M = {
    floor:mat(0x342116,.72,.03),
    wall:mat(0x18231f,.88,0),
    walnut:mat(C.walnut,.55,.05),
    walnut2:mat(C.walnut2,.48,.08),
    brass:mat(C.brass,.3,.75),
    brassDark:mat(C.brassDark,.38,.65),
    black:mat(0x080b0b,.38,.2),
    green:mat(C.green,.66,.03),
    cloth:mat(0x1a2d28,.95,0),
    cream:mat(C.cream,.75,0),
    glass:new THREE.MeshStandardMaterial({color:0x8dd7c3,transparent:true,opacity:.17,roughness:.16,metalness:.15}),
    screen:mat(0x17392f,.25,.08,C.screen,2.7),
    red:mat(0x54231f,.3,.05,C.red,1.8),
    paper:mat(0xc9c2a8,.9,0),
    pot:mat(0x4b3424,.8,.05)
  };

  function box(name, sx,sy,sz, x,y,z, material, cast=true, receive=true){
    const o = new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz), material);
    o.name=name; o.position.set(x,y,z); o.castShadow=cast; o.receiveShadow=receive;
    scene.add(o); return o;
  }
  function cyl(name, rt,rb,h,seg,x,y,z,material){
    const o = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),material);
    o.name=name; o.position.set(x,y,z); o.castShadow=true; o.receiveShadow=true;
    scene.add(o); return o;
  }
  function sphere(name,r,x,y,z,material,sx=1,sy=1,sz=1){
    const o=new THREE.Mesh(new THREE.SphereGeometry(r,24,16),material);
    o.name=name;o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;o.receiveShadow=true;
    scene.add(o);return o;
  }
  function blob(x,z,sx,sz,opacity=.24){
    const m=new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity,depthWrite:false});
    const o=new THREE.Mesh(new THREE.CircleGeometry(1,32),m);
    o.rotation.x=-Math.PI/2;o.position.set(x,.022,z);o.scale.set(sx,sz,1);scene.add(o);return o;
  }
  function canvasTexture(w,h,draw){
    const c=document.createElement("canvas");c.width=w;c.height=h;
    const g=c.getContext("2d");draw(g,w,h);
    const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
    t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t;
  }
  function labelTexture(text, fg="#84e3ba", bg="rgba(9,23,19,.72)", size=76, width=512, height=128){
    return canvasTexture(width,height,(g,w,h)=>{
      g.clearRect(0,0,w,h);
      g.fillStyle=bg;g.fillRect(3,3,w-6,h-6);
      g.strokeStyle="rgba(171,145,70,.65)";g.lineWidth=3;g.strokeRect(4,4,w-8,h-8);
      g.font=`600 ${size}px Arial`;g.textAlign="center";g.textBaseline="middle";
      g.shadowColor=fg;g.shadowBlur=18;g.fillStyle=fg;g.fillText(text,w/2,h/2+2);
    });
  }
  function planeLabel(text,x,y,z,w,h,fg,size=66){
    const material=new THREE.MeshBasicMaterial({map:labelTexture(text,fg,"rgba(7,18,15,.80)",size),transparent:true,depthWrite:false});
    const p=new THREE.Mesh(new THREE.PlaneGeometry(w,h),material);
    p.position.set(x,y,z);scene.add(p);return p;
  }

  const floorTex=canvasTexture(1024,768,(g,w,h)=>{
    g.fillStyle="#2b1b13";g.fillRect(0,0,w,h);
    const ph=48,pw=170;
    for(let row=0;row<Math.ceil(h/ph);row++){
      const off=(row%2)*pw*.5;
      for(let x=-pw;x<w+pw;x+=pw){
        const xx=x+off;
        const n=(Math.sin((row*19+x)*.071)+1)*.5;
        g.fillStyle=`rgb(${43+n*13},${27+n*8},${18+n*5})`;
        g.fillRect(xx+2,row*ph+2,pw-4,ph-4);
        g.strokeStyle="rgba(174,116,67,.12)";g.lineWidth=2;g.strokeRect(xx+3,row*ph+3,pw-6,ph-6);
        for(let k=0;k<4;k++){
          g.strokeStyle="rgba(225,173,110,.025)";
          g.beginPath();g.moveTo(xx+8,row*ph+10+k*8);g.lineTo(xx+pw-9,row*ph+11+k*8);g.stroke();
        }
      }
    }
  });
  floorTex.wrapS=floorTex.wrapT=THREE.RepeatWrapping;
  floorTex.repeat.set(2.5,2.5);
  M.floor.map=floorTex;M.floor.needsUpdate=true;

  box("parquet floor",24,.35,18,0,-.2,0,M.floor,false,true);
  box("back wall",24,8.4,.38,0,4.0,-9.0,M.wall,false,true);
  box("left wall",.38,8.4,18,-12,4.0,0,M.wall,false,true);

  // Walnut wall wainscoting and brass inlay
  box("back walnut panels",23.5,2.75,.18,0,1.55,-8.77,M.walnut2,false,true);
  box("left walnut panels",.18,2.75,17.5,-11.77,1.55,0,M.walnut2,false,true);
  for(let x=-10.5;x<=10.5;x+=3){
    box("wall panel stile",.08,2.45,.08,x,1.55,-8.65,M.brassDark,false,false);
  }
  box("back picture rail",23.6,.09,.15,0,3.03,-8.62,M.brass,false,false);
  box("left picture rail",.15,.09,17.6,-11.62,3.03,0,M.brass,false,false);
  box("back baseboard",24,.25,.26,0,.04,-8.68,M.walnut,false,true);
  box("left baseboard",.26,.25,18,-11.68,.04,0,M.walnut,false,true);

  // Rug with subtle grid
  const rugTex=canvasTexture(512,256,(g,w,h)=>{
    g.fillStyle="#142620";g.fillRect(0,0,w,h);
    g.strokeStyle="rgba(105,157,126,.18)";g.lineWidth=2;
    for(let x=18;x<w;x+=32){g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke();}
    for(let y=16;y<h;y+=32){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke();}
    g.strokeStyle="rgba(190,155,74,.38)";g.lineWidth=8;g.strokeRect(8,8,w-16,h-16);
    g.strokeStyle="rgba(190,155,74,.18)";g.lineWidth=2;g.strokeRect(20,20,w-40,h-40);
  });
  const rugMat=new THREE.MeshStandardMaterial({map:rugTex,roughness:1});
  box("grid rug",10.7,.055,6.8,0,.02,.75,rugMat,false,true);

  // Door to campus
  box("door frame top",3.4,.35,.42,7.1,6.25,-8.54,M.brassDark);
  box("door frame left",.32,5.75,.42,5.55,3.18,-8.54,M.brassDark);
  box("door frame right",.32,5.75,.42,8.65,3.18,-8.54,M.brassDark);
  box("campus door",2.75,5.55,.22,7.1,3.17,-8.48,M.walnut);
  box("door inset",2.1,3.4,.07,7.1,3.45,-8.34,M.walnut2);
  box("door kickplate",2.2,.5,.09,7.1,.75,-8.31,M.brassDark);
  sphere("door knob",.13,8.08,3.05,-8.17,M.brass);
  planeLabel("RETURN TO CAMPUS",7.1,5.35,-8.17,2.15,.42,"#d9c678",35);

  // Floating MIDAS sign and halo
  const midas=planeLabel("MIDAS",0,6.35,-8.48,5.8,1.42,"#8df0bd",78);
  const haloMat=new THREE.MeshBasicMaterial({color:0x5fc89d,transparent:true,opacity:.09,depthWrite:false,blending:THREE.AdditiveBlending});
  const halo=new THREE.Mesh(new THREE.PlaneGeometry(7.2,2.4),haloMat);
  halo.position.set(0,6.35,-8.52);scene.add(halo);

  // Ticker
  const tickerTex=canvasTexture(1024,96,(g,w,h)=>{
    g.fillStyle="#07110f";g.fillRect(0,0,w,h);
    g.font="bold 34px monospace";g.textBaseline="middle";
    const bits=[
      ["GOLD  +0.84%","#71d8a8"],["DXY  -0.21%","#d77868"],
      ["UST10Y  4.18","#d9c879"],["VOL  14.6","#71d8a8"],["CASH  18.2%","#d9c879"]
    ];
    let x=20;
    bits.forEach(([s,c])=>{g.fillStyle=c;g.fillText(s,x,h/2);x+=g.measureText(s).width+62;});
  });
  const tickerMat=new THREE.MeshStandardMaterial({map:tickerTex,emissive:0x4caa83,emissiveIntensity:.65,roughness:.32});
  const ticker=box("market ticker",10.4,.72,.12,-1.0,4.68,-8.52,tickerMat,false,false);

  // Clock on back wall
  const clockGroup=new THREE.Group();clockGroup.position.set(-8.55,5.55,-8.45);scene.add(clockGroup);
  const clockBody=new THREE.Mesh(new THREE.CylinderGeometry(.86,.86,.18,48),M.brassDark);
  clockBody.rotation.x=Math.PI/2;clockBody.castShadow=true;clockGroup.add(clockBody);
  const faceMat=mat(0xd2cbb0,.82,0);
  const face=new THREE.Mesh(new THREE.CircleGeometry(.72,48),faceMat);face.position.z=.101;clockGroup.add(face);
  for(let i=0;i<12;i++){
    const a=i*Math.PI/6;
    const tick=new THREE.Mesh(new THREE.BoxGeometry(i%3===0?.06:.035,i%3===0?.18:.11,.025),M.walnut);
    tick.position.set(Math.sin(a)*.57,Math.cos(a)*.57,.125);tick.rotation.z=-a;clockGroup.add(tick);
  }
  const clockHour=new THREE.Mesh(new THREE.BoxGeometry(.055,.38,.035),M.walnut);
  clockHour.position.set(.1,.13,.145);clockHour.rotation.z=-.7;clockGroup.add(clockHour);
  const clockMinute=new THREE.Mesh(new THREE.BoxGeometry(.035,.52,.035),M.walnut);
  clockMinute.position.set(-.17,.18,.155);clockMinute.rotation.z=.78;clockGroup.add(clockMinute);
  sphere("clock pin",.06,-8.55,5.55,-8.29,M.brass);

  // Main island desk
  blob(0,.65,5.4,3.1,.34);
  box("island plinth",7.45,1.25,3.45,0,.72,.45,M.walnut);
  box("desk top",8.35,.28,4.05,0,1.47,.45,M.walnut2);
  box("desk brass edge",8.43,.075,4.12,0,1.58,.45,M.brass);
  box("desk front inset",5.1,.68,.05,0,.78,2.21,M.green);
  box("desk front brass line",5.5,.055,.08,0,1.18,2.25,M.brass);
  for(const x of [-3.35,3.35]){
    box("desk foot",.48,.18,3.15,x,.09,.45,M.brassDark);
  }

  // Monitors with geometric candlesticks
  const monitorScreens=[];
  function monitor(x,z,rot=0){
    const group=new THREE.Group();group.position.set(x,1.68,z);group.rotation.y=rot;scene.add(group);
    const frame=new THREE.Mesh(new THREE.BoxGeometry(1.72,1.32,.12),M.black);
    frame.position.y=.77;frame.castShadow=true;group.add(frame);
    const smat=M.screen.clone();
    const screen=new THREE.Mesh(new THREE.PlaneGeometry(1.51,1.1),smat);
    screen.position.set(0,.78,.067);group.add(screen);monitorScreens.push(smat);
    const stand=new THREE.Mesh(new THREE.BoxGeometry(.13,.42,.12),M.brassDark);
    stand.position.y=.16;group.add(stand);
    const base=new THREE.Mesh(new THREE.BoxGeometry(.65,.07,.36),M.brassDark);
    base.position.y=-.01;base.position.z=.04;group.add(base);
    const colors=[0x74dcae,0xd76b5f,0x74dcae,0x74dcae,0xd76b5f,0x74dcae];
    for(let i=0;i<6;i++){
      const cx=-.62+i*.24;
      const open=.13+((i*17)%5)*.055;
      const barMat=new THREE.MeshBasicMaterial({color:colors[i]});
      const wick=new THREE.Mesh(new THREE.BoxGeometry(.025,.38,.012),barMat);
      wick.position.set(cx,.77,.076);screen.add(wick);
      const candle=new THREE.Mesh(new THREE.BoxGeometry(.105,open,.018),barMat);
      candle.position.set(cx,.65+(i%3)*.09,.082);screen.add(candle);
    }
    const gridMat=new THREE.MeshBasicMaterial({color:0x7fd4b3,transparent:true,opacity:.12});
    for(let i=0;i<3;i++){
      const line=new THREE.Mesh(new THREE.BoxGeometry(1.36,.008,.006),gridMat);
      line.position.set(0,.42+i*.3,.074);group.add(line);
    }
    return group;
  }
  monitor(-2.72,.07,-.05);
  monitor(-.91,-.02,-.015);
  monitor(.91,-.02,.015);
  monitor(2.72,.07,.05);

  // Keyboard and desk accessories
  box("keyboard",1.7,.08,.55,-.65,1.68,1.62,M.black);
  for(let r=0;r<3;r++) for(let c=0;c<9;c++)
    box("key",.12,.018,.09,-1.16+c*.14,1.727,1.47+r*.12,M.brassDark,false,false);
  const notepad=box("notepad",1.05,.04,.72,2.55,1.66,1.42,M.paper);
  notepad.rotation.y=-.18;
  for(let i=0;i<4;i++) box("note line",.7,.008,.012,2.55,1.687,1.23+i*.12,M.greenDark,false,false);

  // Coffee cup
  cyl("coffee cup",.22,.18,.42,24,1.55,1.87,1.48,M.cream);
  const coffee=new THREE.Mesh(new THREE.CircleGeometry(.17,24),mat(0x24130d,.4,0));
  coffee.rotation.x=-Math.PI/2;coffee.position.set(1.55,2.09,1.48);scene.add(coffee);
  const handle=new THREE.Mesh(new THREE.TorusGeometry(.16,.045,10,20,Math.PI*1.55),M.cream);
  handle.position.set(1.77,1.89,1.48);handle.rotation.y=Math.PI/2;scene.add(handle);

  // Chairs
  function chair(x,z,rot=0){
    const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;scene.add(g);
    const seat=new THREE.Mesh(new THREE.BoxGeometry(1.25,.22,1.2),M.cloth);seat.position.y=.9;seat.castShadow=true;g.add(seat);
    const back=new THREE.Mesh(new THREE.BoxGeometry(1.25,1.65,.22),M.cloth);back.position.set(0,1.65,.51);back.castShadow=true;g.add(back);
    const stem=new THREE.Mesh(new THREE.CylinderGeometry(.11,.13,.68,16),M.brassDark);stem.position.y=.47;g.add(stem);
    for(let i=0;i<5;i++){
      const a=i*Math.PI*2/5;
      const leg=new THREE.Mesh(new THREE.BoxGeometry(.08,.08,.78),M.brassDark);
      leg.position.set(Math.sin(a)*.31,.17,Math.cos(a)*.31);leg.rotation.y=a;g.add(leg);
    }
    blob(x,z,.85,.75,.22);
    return g;
  }
  chair(-.65,3.0,Math.PI);
  chair(3.4,3.25,Math.PI*.92);
  chair(-4.1,-2.3,.15);

  // Agent figures
  function agent(name,x,z,color,rotation=0){
    const g=new THREE.Group();g.name=name;g.position.set(x,0,z);g.rotation.y=rotation;scene.add(g);
    const bodyMat=mat(color,.68,.02);
    const body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.85,8,16),bodyMat);
    body.position.y=1.28;body.castShadow=true;g.add(body);
    const head=new THREE.Mesh(new THREE.SphereGeometry(.37,24,16),mat(0xb99a7a,.76,0));
    head.position.y=2.25;head.castShadow=true;g.add(head);
    const hair=new THREE.Mesh(new THREE.SphereGeometry(.38,24,12,0,Math.PI*2,0,Math.PI*.47),mat(0x231912,.85,0));
    hair.position.y=2.33;hair.castShadow=true;g.add(hair);
    const badge=new THREE.Mesh(new THREE.BoxGeometry(.18,.12,.025),M.brass);
    badge.position.set(.22,1.45,.405);g.add(badge);
    const armL=new THREE.Mesh(new THREE.CapsuleGeometry(.11,.64,6,12),bodyMat);
    const armR=armL.clone();armL.castShadow=armR.castShadow=true;
    g.add(armL,armR);
    blob(x,z,.7,.55,.25);
    return {g,body,head,armL,armR};
  }
  const typing=agent("typing analyst",-.62,2.7,0x304d43,Math.PI);
  typing.body.position.y=1.18;typing.head.position.y=2.05;typing.g.scale.set(.92,.92,.92);
  typing.armL.position.set(-.34,1.42,-.34);typing.armR.position.set(.34,1.42,-.34);
  typing.armL.rotation.x=1.17;typing.armR.rotation.x=1.17;
  typing.armL.rotation.z=-.16;typing.armR.rotation.z=.16;

  const idle=agent("idle portfolio agent",-4.9,2.55,0x4b3c2e,-.28);
  idle.armL.position.set(-.48,1.34,0);idle.armR.position.set(.48,1.34,0);
  idle.armL.rotation.z=-.12;idle.armR.rotation.z=.12;

  // Credenza and books
  box("side credenza",5.1,1.15,1.3,-8.55,.68,-5.8,M.walnut);
  box("credenza top",5.35,.14,1.5,-8.55,1.31,-5.8,M.walnut2);
  for(const x of [-9.9,-8.55,-7.2]){
    box("cabinet door",1.18,.78,.05,x,.72,-5.12,M.walnut2);
    sphere("cabinet pull",.055,x+.42,.72,-5.05,M.brass);
  }
  const bookColors=[0x72503b,0x314b40,0x7b6536,0x4d2c28,0x4b5c56];
  for(let i=0;i<5;i++){
    const b=box("book",.38+.08*(i%2),.16,.92,-10.1+i*.44,1.46,-5.72,mat(bookColors[i],.85,0));
    b.rotation.y=(i-2)*.025;
  }
  box("bookend",.1,.65,.78,-10.38,1.66,-5.72,M.brass);

  // Banker's lamp
  cyl("lamp base",.42,.48,.09,28,-6.95,1.43,-5.75,M.brass);
  const lampStem=cyl("lamp stem",.045,.055,1.2,16,-6.95,2.02,-5.75,M.brass);
  const shade=new THREE.Mesh(new THREE.CylinderGeometry(.22,.55,.42,24,1,false),M.green);
  shade.rotation.z=Math.PI/2;shade.position.set(-6.95,2.65,-5.75);shade.castShadow=true;scene.add(shade);
  const lampGlow=new THREE.PointLight(0xffc978,2.4,6,2);lampGlow.position.set(-6.45,2.55,-5.75);scene.add(lampGlow);

  // Plant and planter
  cyl("plant pot",.65,.48,.92,24,-9.7,.47,5.9,M.pot);
  cyl("plant soil",.56,.56,.04,24,-9.7,.95,5.9,mat(0x15100c,1,0));
  for(let i=0;i<11;i++){
    const a=i*Math.PI*2/11;
    const leaf=sphere("plant leaf",.5,-9.7+Math.sin(a)*.42,1.45+(i%4)*.28,5.9+Math.cos(a)*.42,mat(i%2?0x315c43:0x244b37,.82,0),.48,1.25,.36);
    leaf.rotation.z=Math.sin(a)*.55;leaf.rotation.x=Math.cos(a)*.35;
  }
  blob(-9.7,5.9,.9,.75,.3);

  // Globe on a side table
  cyl("globe table stem",.1,.12,1.05,16,8.8,.58,-2.3,M.brassDark);
  cyl("globe table top",.66,.66,.13,28,8.8,1.12,-2.3,M.walnut2);
  const globe=sphere("market globe",.55,8.8,1.82,-2.3,mat(0x315b55,.45,.15,C.screen,.22));
  globe.rotation.z=-.28;
  const globeRing=new THREE.Mesh(new THREE.TorusGeometry(.65,.035,10,48),M.brass);
  globeRing.position.set(8.8,1.82,-2.3);globeRing.rotation.x=Math.PI/2;globeRing.rotation.y=.3;scene.add(globeRing);

  // Wastebasket and papers
  const waste=new THREE.Mesh(new THREE.CylinderGeometry(.38,.28,.72,18,1,true),new THREE.MeshStandardMaterial({color:0x2d372f,roughness:.55,metalness:.45,wireframe:true}));
  waste.position.set(4.9,.37,2.3);waste.castShadow=true;scene.add(waste);
  for(let i=0;i<3;i++){
    const p=box("discarded paper",.34,.04,.26,4.75+i*.12,.72,2.25+(i%2)*.15,M.paper);
    p.rotation.set(.2*i,.3*i,.4*i);
  }

  // Brass railing along the open edge
  for(const z of [-1.5,1.1,3.7,6.3]){
    cyl("railing post",.075,.09,1.05,14,11.2,.52,z,M.brass);
    sphere("railing cap",.12,11.2,1.08,z,M.brass);
  }
  box("railing top",.11,.11,7.9,11.2,1.03,2.4,M.brass);
  box("railing lower",.07,.07,7.9,11.2,.45,2.4,M.brassDark);

  // Coat stand
  cyl("coat stand pole",.06,.08,2.7,14,-10.4,1.36,-1.8,M.brassDark);
  cyl("coat stand base",.42,.48,.1,20,-10.4,.08,-1.8,M.brassDark);
  for(let i=0;i<4;i++){
    const a=i*Math.PI/2;
    const hook=box("coat hook",.08,.08,.65,-10.4+Math.sin(a)*.25,2.5,-1.8+Math.cos(a)*.25,M.brass);
    hook.rotation.y=a;
  }
  const coat=box("hanging coat",.8,1.35,.18,-9.98,1.75,-1.8,M.green);
  coat.rotation.z=-.08;

  // Small archive safe
  box("archive safe",1.7,1.8,1.4,9.65,.9,-6.15,mat(0x202825,.45,.55));
  box("safe door",1.36,1.48,.08,9.65,.95,-5.41,mat(0x26302c,.38,.65));
  const dial=new THREE.Mesh(new THREE.CylinderGeometry(.24,.24,.12,24),M.brassDark);
  dial.rotation.x=Math.PI/2;dial.position.set(9.65,1.08,-5.31);scene.add(dial);
  for(let i=0;i<4;i++){
    const a=i*Math.PI/2;
    const spoke=box("safe spoke",.045,.5,.045,9.65+Math.sin(a)*.17,1.08+Math.cos(a)*.17,-5.22,M.brass);
    spoke.rotation.z=-a;
  }

  // Warm floor uplights
  function floorLight(x,z){
    cyl("floor uplight",.22,.28,.1,20,x,.07,z,M.brassDark);
    const l=new THREE.PointLight(0xffb86a,1.35,6,2);l.position.set(x,.65,z);scene.add(l);
  }
  floorLight(-10.8,-7.6);
  floorLight(10.4,-7.55);

  // Lighting
  const hemi=new THREE.HemisphereLight(0x77998e,0x1b100c,1.25);scene.add(hemi);
  const key=new THREE.DirectionalLight(0xffd39b,2.3);
  key.position.set(5,15,9);key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);
  key.shadow.camera.left=-18;key.shadow.camera.right=18;key.shadow.camera.top=18;key.shadow.camera.bottom=-18;
  key.shadow.camera.near=2;key.shadow.camera.far=50;key.shadow.bias=-.0004;
  scene.add(key);
  const screenFill=new THREE.PointLight(0x66ddb3,3.0,10,2);
  screenFill.position.set(0,3.2,1.25);scene.add(screenFill);
  const backWarm=new THREE.PointLight(0xffc47f,2.0,13,2);
  backWarm.position.set(3.5,6,-6.7);scene.add(backWarm);

  // Small dust motes
  const dustGeo=new THREE.BufferGeometry();
  const dustPos=[];
  for(let i=0;i<180;i++) dustPos.push((Math.random()-.5)*22,Math.random()*7.5+.2,(Math.random()-.5)*16);
  dustGeo.setAttribute("position",new THREE.Float32BufferAttribute(dustPos,3));
  const dust=new THREE.Points(dustGeo,new THREE.PointsMaterial({color:0xd7c99a,size:.025,transparent:true,opacity:.24,depthWrite:false}));
  scene.add(dust);

  // Input
  const keys={};
  addEventListener("keydown",e=>{
    const k=e.key.toLowerCase();
    if(["w","a","s","d","arrowup","arrowdown","arrowleft","arrowright","q","e"].includes(k)) e.preventDefault();
    keys[k]=true;
    if(!e.repeat && k==="q"){yaw-=Math.PI/12;updateCamera();}
    if(!e.repeat && k==="e"){yaw+=Math.PI/12;updateCamera();}
  });
  addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

  let dragging=false,lastX=0;
  renderer.domElement.style.cursor="grab";
  renderer.domElement.addEventListener("pointerdown",e=>{
    dragging=true;lastX=e.clientX;renderer.domElement.style.cursor="grabbing";
    renderer.domElement.setPointerCapture(e.pointerId);
  });
  renderer.domElement.addEventListener("pointermove",e=>{
    if(!dragging)return;
    const dx=e.clientX-lastX;lastX=e.clientX;
    yaw-=dx*.006;updateCamera();
  });
  renderer.domElement.addEventListener("pointerup",e=>{
    dragging=false;renderer.domElement.style.cursor="grab";
    try{renderer.domElement.releasePointerCapture(e.pointerId)}catch(_){}
  });
  renderer.domElement.addEventListener("pointercancel",()=>{dragging=false;renderer.domElement.style.cursor="grab";});

  const clock=new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
    let forward=0,right=0;
    if(keys.w||keys.arrowup)forward-=1;
    if(keys.s||keys.arrowdown)forward+=1;
    if(keys.a||keys.arrowleft)right-=1;
    if(keys.d||keys.arrowright)right+=1;
    if(forward||right){
      const f=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
      const r=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
      const v=f.multiplyScalar(-forward).add(r.multiplyScalar(right));
      if(v.lengthSq()>0)v.normalize().multiplyScalar(4.4*dt);
      target.add(v);
      target.x=THREE.MathUtils.clamp(target.x,-6.5,6.5);
      target.z=THREE.MathUtils.clamp(target.z,-4.7,5.3);
      updateCamera();
    }

    idle.g.scale.y=1+Math.sin(t*1.55)*.012;
    idle.head.position.y=2.25+Math.sin(t*1.55)*.012;
    typing.armL.rotation.x=1.17+Math.sin(t*8.4)*.055;
    typing.armR.rotation.x=1.17+Math.sin(t*8.4+Math.PI)*.055;
    typing.head.rotation.y=Math.sin(t*.55)*.12;

    monitorScreens.forEach((m,i)=>m.emissiveIntensity=2.35+Math.sin(t*1.8+i*.8)*.28);
    midas.material.opacity=.9+Math.sin(t*1.7)*.08;
    halo.material.opacity=.075+Math.sin(t*1.7)*.025;
    ticker.position.x=-1+Math.sin(t*.18)*.025;
    globe.rotation.y+=dt*.18;
    dust.rotation.y+=dt*.008;
    dust.position.y=Math.sin(t*.18)*.06;

    renderer.render(scene,camera);
  }
  animate();
})();
</script>
</body>
</html>
