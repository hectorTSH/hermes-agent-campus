<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Midas · War Room</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0d0a}
  #hud{position:fixed;top:10px;left:12px;color:#c8b98a;font:12px/1.4 monospace;
       text-shadow:0 1px 2px #000;pointer-events:none;z-index:10}
  #hud b{color:#e8d9a8}
  #keys{position:fixed;bottom:10px;left:12px;color:#6f6a55;font:11px monospace;pointer-events:none;z-index:10}
</style>
</head>
<body>
<div id="hud"><b>MIDAS</b> · generated by openrouter/kimi-k3</div>
<div id="keys">WASD / arrows pan · Q/E yaw</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function(){
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d0a);
scene.fog = new THREE.Fog(0x0b0d0a, 26, 60);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

// ---------- camera rig ----------
const FOV = 38;
const camera = new THREE.PerspectiveCamera(FOV, innerWidth/innerHeight, 0.1, 200);
const target = new THREE.Vector3(0,0.8,0);
let yaw = Math.PI*0.25;               // 45°
const DIST = 17, ELEV = THREE.MathUtils.degToRad(52);
function updateCam(){
  const h = Math.cos(ELEV)*DIST, y = Math.sin(ELEV)*DIST;
  camera.position.set(target.x + Math.cos(yaw)*h, target.y + y, target.z + Math.sin(yaw)*h);
  camera.lookAt(target);
}
updateCam();

// ---------- materials ----------
const M = {
  walnut:  new THREE.MeshStandardMaterial({color:0x3a2a1c, roughness:0.75, metalness:0.05}),
  walnutD: new THREE.MeshStandardMaterial({color:0x2a1d12, roughness:0.8}),
  brass:   new THREE.MeshStandardMaterial({color:0xc9a24b, roughness:0.3, metalness:0.85}),
  brassD:  new THREE.MeshStandardMaterial({color:0x8a6d33, roughness:0.45, metalness:0.7}),
  wall:    new THREE.MeshStandardMaterial({color:0x2e2a22, roughness:0.95}),
  wallTrim:new THREE.MeshStandardMaterial({color:0x241f17, roughness:0.9}),
  carpet:  new THREE.MeshStandardMaterial({color:0x1d2a20, roughness:1}),
  screen:  new THREE.MeshStandardMaterial({color:0x06110a, emissive:0x1f5a34, emissiveIntensity:1.4, roughness:0.4}),
  green:   new THREE.MeshStandardMaterial({color:0x2f7a4a, emissive:0x2f7a4a, emissiveIntensity:1.6}),
  red:     new THREE.MeshStandardMaterial({color:0xa03a2a, emissive:0xa03a2a, emissiveIntensity:1.4}),
  paper:   new THREE.MeshStandardMaterial({color:0xd8cfb8, roughness:0.9}),
  leather: new THREE.MeshStandardMaterial({color:0x4a3220, roughness:0.6}),
  plant:   new THREE.MeshStandardMaterial({color:0x2e5d33, roughness:0.9}),
  pot:     new THREE.MeshStandardMaterial({color:0x6b4a2e, roughness:0.8}),
  dark:    new THREE.MeshStandardMaterial({color:0x1a1712, roughness:0.9}),
  holo:    new THREE.MeshBasicMaterial({color:0x7fe8a8, transparent:true, opacity:0.85}),
  agentA:  new THREE.MeshStandardMaterial({color:0x5a4632, roughness:0.7}),
  agentB:  new THREE.MeshStandardMaterial({color:0x33424e, roughness:0.7}),
  skin:    new THREE.MeshStandardMaterial({color:0xc9a184, roughness:0.8}),
};
function box(w,h,d,mat,x,y,z,ry=0,parent=scene){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z); m.rotation.y=ry;
  m.castShadow = m.receiveShadow = true;
  parent.add(m); return m;
}
function cyl(rt,rb,h,mat,x,y,z,seg=20,parent=scene){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat);
  m.position.set(x,y,z); m.castShadow=m.receiveShadow=true; parent.add(m); return m;
}

// ---------- floor: herringbone-ish parquet ----------
const floorG = new THREE.Group(); scene.add(floorG);
const plankA = new THREE.MeshStandardMaterial({color:0x4a3520, roughness:0.7});
const plankB = new THREE.MeshStandardMaterial({color:0x3d2b19, roughness:0.75});
for(let i=-7;i<=7;i++) for(let j=-7;j<=7;j++){
  const p = box(1.05,0.08,0.5, ((i+j)%2===0)?plankA:plankB, i*1.02, -0.04, j*0.52, ((i+j)%2===0)?0:Math.PI/2, floorG);
  p.receiveShadow = true; p.castShadow = false;
}
// subtle brass grid inlay
for(let i=-3;i<=3;i++){
  box(0.03,0.005,15, M.brassD, i*2.1, 0.005, 0).castShadow=false;
  box(15,0.005,0.03, M.brassD, 0, 0.005, i*2.1).castShadow=false;
}

// ---------- rug ----------
const rug = cyl(2.6,2.6,0.03, M.carpet, 0,0.02,0.4, 40);
const rugRing = new THREE.Mesh(new THREE.TorusGeometry(2.35,0.04,8,48), M.brassD);
rugRing.rotation.x = Math.PI/2; rugRing.position.set(0,0.045,0.4); scene.add(rugRing);

// ---------- walls (open toward camera: only far + left) ----------
const WALL_H = 4.2;
box(16, WALL_H, 0.3, M.wall, 0, WALL_H/2, -7.5);            // far wall
box(0.3, WALL_H, 16, M.wall, -7.5, WALL_H/2, 0);            // left wall
// wainscoting + trim
box(16, 1.0, 0.34, M.wallTrim, 0, 0.5, -7.5);
box(0.34, 1.0, 16, M.wallTrim, -7.5, 0.5, 0);
box(16, 0.12, 0.4, M.brassD, 0, 1.02, -7.5);
box(0.4, 0.12, 16, M.brassD, -7.5, 1.02, 0);
// right & near: low railing only (keeps 3/4 view open)
function railing(x,z,len,ry){
  const g = new THREE.Group(); g.position.set(x,0,z); g.rotation.y=ry; scene.add(g);
  box(len,0.06,0.06,M.brass,0,0.95,0,0,g);
  box(len,0.04,0.04,M.brassD,0,0.5,0,0,g);
  for(let i=0;i<=len;i+=1.6) cyl(0.035,0.035,0.95,M.brassD,-len/2+i,0.475,0,10,g);
}
railing(7.5,0,15,Math.PI/2);
railing(0,7.5,15,0);

// ---------- far-wall door ----------
box(1.5,2.6,0.12,M.walnutD, 3.2,1.3,-7.32);
box(1.7,0.1,0.16,M.brassD, 3.2,2.66,-7.32);
box(0.1,2.7,0.16,M.brassD, 2.4,1.35,-7.32);
box(0.1,2.7,0.16,M.brassD, 4.0,1.35,-7.32);
const knob = new THREE.Mesh(new THREE.SphereGeometry(0.06,12,12), M.brass);
knob.position.set(3.75,1.25,-7.22); scene.add(knob);
// exit sign
const exitSign = box(0.7,0.22,0.06, new THREE.MeshStandardMaterial({color:0x0a2012, emissive:0x2fae5e, emissiveIntensity:1.2}), 3.2, 2.95, -7.3);

// ---------- central island desk ----------
const desk = new THREE.Group(); scene.add(desk);
box(4.6,0.12,2.2,M.walnut, 0,1.02,0, 0, desk);                 // top
box(4.7,0.05,2.3,M.brassD, 0,1.09,0, 0, desk);                 // brass rim
box(0.5,1.0,1.8,M.walnutD, -1.9,0.5,0, 0, desk);               // pedestals
box(0.5,1.0,1.8,M.walnutD,  1.9,0.5,0, 0, desk);
box(3.4,0.7,0.08,M.walnutD, 0,0.55,-0.95, 0, desk);            // modesty panel
cyl(0.05,0.05,0.9,M.brass, 0,0.5,0.95, 10, desk);              // front stretcher

// ---------- monitors (4 slabs w/ candlesticks) ----------
const screens = [];
function monitor(x,z,ry,seed){
  const g = new THREE.Group(); g.position.set(x,1.1,z); g.rotation.y=ry; scene.add(g);
  cyl(0.05,0.07,0.5,M.dark, 0,0.25,0, 10, g);
  box(0.35,0.04,0.25,M.dark, 0,0.02,0, 0, g);
  const slab = box(1.15,0.72,0.05, M.dark, 0,0.85,0, 0, g);
  const face = new THREE.Mesh(new THREE.PlaneGeometry(1.05,0.62), M.screen.clone());
  face.position.set(0,0.85,0.028); g.add(face);
  // candlesticks
  const candles = [];
  for(let i=0;i<10;i++){
    const up = Math.sin(seed+i*1.7)>0;
    const h = 0.08+Math.abs(Math.sin(seed*3+i*2.3))*0.3;
    const c = box(0.05,h,0.01, up?M.green:M.red, -0.45+i*0.1, 0.68+h/2, 0.035, 0, g);
    c.castShadow=false; candles.push({m:c,up,ph:i*0.9+seed});
    const wick = box(0.012,0.06,0.01, up?M.green:M.red, -0.45+i*0.1, 0.68+h+0.03, 0.035, 0, g);
    wick.castShadow=false;
  }
  screens.push({face,candles});
  return g;
}
monitor(-1.5,-0.55, 0.15, 1);
monitor(-0.5,-0.65, 0.05, 4);
monitor( 0.5,-0.65,-0.05, 7);
monitor( 1.5,-0.55,-0.15, 11);

// keyboard + mouse + coffee on desk
box(0.9,0.04,0.3,M.dark, -0.6,1.13,0.35);
box(0.14,0.03,0.2,M.dark, 0.05,1.12,0.4);
const mug = cyl(0.07,0.06,0.12,M.paper, 0.6,1.17,0.5, 14);
const mugHandle = new THREE.Mesh(new THREE.TorusGeometry(0.05,0.015,8,16), M.paper);
mugHandle.position.set(0.68,1.17,0.5); scene.add(mugHandle);
const steamMat = new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.15});
const steam = cyl(0.02,0.05,0.25,steamMat,0.6,1.35,0.5,8); steam.castShadow=false;

// ---------- agents ----------
function agent(color, x,z,ry){
  const g = new THREE.Group(); g.position.set(x,0,z); g.rotation.y=ry; scene.add(g);
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.28,0.55,6,14), color);
  body.position.y = 0.85; body.castShadow=true; g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.22,16,16), M.skin);
  head.position.y = 1.5; head.castShadow=true; g.add(head);
  const armL = new THREE.Mesh(new THREE.CapsuleGeometry(0.07,0.4,4,8), color);
  const armR = armL.clone();
  armL.position.set(-0.34,1.05,0.1); armR.position.set(0.34,1.05,0.1);
  armL.castShadow=armR.castShadow=true;
  g.add(armL,armR);
  return {g,body,head,armL,armR};
}
const typer = agent(M.agentA, -0.6, 1.5, Math.PI);   // facing desk (toward -z)
typer.armL.rotation.x = -1.1; typer.armR.rotation.x = -1.1;
typer.armL.position.z = -0.15; typer.armR.position.z = -0.15;
const idler = agent(M.agentB, 2.6, 2.2, -2.2);

// chairs
function chair(x,z,ry){
  const g = new THREE.Group(); g.position.set(x,0,z); g.rotation.y=ry; scene.add(g);
  box(0.55,0.07,0.55,M.leather, 0,0.5,0, 0,g);
  box(0.55,0.6,0.07,M.leather, 0,0.85,-0.26, 0,g);
  cyl(0.04,0.04,0.5,M.dark, 0,0.25,0, 10,g);
  for(let a=0;a<5;a++){ const leg=box(0.05,0.05,0.35,M.dark,0,0.04,0, a*Math.PI*2/5, g); leg.position.set(Math.sin(a*Math.PI*2/5)*0.18,0.04,Math.cos(a*Math.PI*2/5)*0.18); }
}
chair(-0.6,1.6,Math.PI);
chair(2.6,2.3,-2.2);
chair(-2.8,1.2,2.6);

// ---------- props ----------
// bookshelf on left wall
const shelf = new THREE.Group(); shelf.position.set(-7.2,0,-2); shelf.rotation.y=Math.PI/2; scene.add(shelf);
box(2.4,2.6,0.35,M.walnutD, 0,1.3,0, 0,shelf);
const bookCols=[0x7a3a2a,0x2a5a3a,0x3a4a7a,0x8a6d33,0x5a3a5a,0xa08a4a];
for(let r=0;r<4;r++){
  box(2.2,0.05,0.3,M.walnut, 0,0.35+r*0.6,0.02, 0,shelf);
  for(let b=0;b<8;b++){
    if(Math.random()<0.15) continue;
    box(0.12,0.35+Math.random()*0.12,0.22, new THREE.MeshStandardMaterial({color:bookCols[(r*8+b)%6],roughness:0.85}),
        -0.95+b*0.26, 0.55+r*0.6, 0.03, (Math.random()-0.5)*0.08, shelf);
  }
}
// plant
const plant = new THREE.Group(); plant.position.set(-6.3,0,5.8); scene.add(plant);
cyl(0.3,0.22,0.45,M.pot, 0,0.22,0, 14,plant);
for(let i=0;i<7;i++){
  const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.09,0.9,6), M.plant);
  leaf.position.set(0,0.85,0); leaf.rotation.z=0.5; leaf.rotation.y=i*Math.PI*2/7;
  leaf.castShadow=true; plant.add(leaf);
}
// brass floor lamp (warm practical)
const lamp = new THREE.Group(); lamp.position.set(5.8,0,-5.8); scene.add(lamp);
cyl(0.25,0.3,0.06,M.brassD, 0,0.03,0, 16,lamp);
cyl(0.03,0.03,1.9,M.brass, 0,0.95,0, 10,lamp);
const shade = new THREE.Mesh(new THREE.ConeGeometry(0.4,0.35,16,1,true),
  new THREE.MeshStandardMaterial({color:0xd8b878,roughness:0.6,side:THREE.DoubleSide,emissive:0x6a4a1a,emissiveIntensity:0.5}));
shade.position.set(0,2.0,0); lamp.add(shade);
const bulb = new THREE.PointLight(0xffc873, 18, 9, 2); bulb.position.set(0,1.85,0);
bulb.castShadow=true; bulb.shadow.mapSize.set(512,512); lamp.add(bulb);

// wall clock (far wall)
const clock = new THREE.Group(); clock.position.set(-2.5,3.0,-7.3); scene.add(clock);
const face = new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,0.05,24), M.paper);
face.rotation.x=Math.PI/2; clock.add(face);
const rim = new THREE.Mesh(new THREE.TorusGeometry(0.4,0.04,8,32), M.brass); clock.add(rim);
const hourH = box(0.04,0.2,0.02,M.dark, 0,0.08,0.04, 0,clock);
const minH  = box(0.03,0.3,0.02,M.dark, 0,0.12,0.05, 0,clock);

// ticker strip along far wall
const ticker = box(6,0.35,0.06, new THREE.MeshStandardMaterial({color:0x081208, emissive:0x1a4a2a, emissiveIntensity:1.0}), 0.5,3.6,-7.32);
const tickerBits = [];
for(let i=0;i<14;i++){
  const b = box(0.22,0.14,0.02, Math.random()>0.4?M.green:M.red, -2.2+i*0.42, 3.6, -7.28);
  b.castShadow=false; tickerBits.push({m:b,ph:i*0.7});
}
// framed chart on left wall
box(1.6,1.1,0.06,M.brassD, -7.32,2.6,2.5, Math.PI/2);
box(1.45,0.95,0.02,M.paper, -7.28,2.6,2.5, Math.PI/2);
for(let i=0;i<6;i++)
  box(0.03,0.15+Math.random()*0.5,0.02, M.green, -7.26,2.35,2.0+i*0.2, 0).castShadow=false;

// sideboard + decanter + papers
box(2.2,0.9,0.6,M.walnut, 5.5,0.45,-6.9);
cyl(0.09,0.12,0.3,M.brass, 5.0,1.05,-6.9, 12);
cyl(0.05,0.05,0.12,M.brass, 5.0,1.26,-6.9, 10);
for(let i=0;i<3;i++) box(0.4,0.01,0.55,M.paper, 5.7+i*0.15,0.92+i*0.012,-6.8, (Math.random()-0.5)*0.5);
// desk papers + pen
box(0.35,0.01,0.45,M.paper, 1.2,1.13,0.3, 0.3);
box(0.3,0.01,0.4,M.paper, 1.35,1.14,0.25, -0.2);
cyl(0.012,0.012,0.18,M.brass, 1.2,1.15,0.55, 8).rotation.z=Math.PI/2;
// globe on sideboard
const globe = new THREE.Mesh(new THREE.SphereGeometry(0.22,18,14),
  new THREE.MeshStandardMaterial({color:0x2a4a5a,roughness:0.5}));
globe.position.set(6.3,1.15,-6.9); globe.castShadow=true; scene.add(globe);
cyl(0.14,0.16,0.05,M.brassD, 6.3,0.93,-6.9, 14);
// waste bin
cyl(0.18,0.14,0.4,M.brassD, -5.5,0.2,5.0, 14);
// ceiling pendant (warm)
cyl(0.02,0.02,1.2,M.dark, 0,4.8,0, 8);
const pend = new THREE.Mesh(new THREE.ConeGeometry(0.5,0.4,18,1,true),
  new THREE.MeshStandardMaterial({color:0x2a2a2a,roughness:0.5,side:THREE.DoubleSide}));
pend.position.set(0,4.15,0); scene.add(pend);
const pendLight = new THREE.PointLight(0xffd9a0, 30, 14, 2);
pendLight.position.set(0,3.9,0); pendLight.castShadow=true;
pendLight.shadow.mapSize.set(1024,1024); pendLight.shadow.bias=-0.002;
scene.add(pendLight);

// ---------- hologram MIDAS ----------
// canvas texture text
const cv = document.createElement('canvas'); cv.width=512; cv.height=160;
const cx = cv.getContext('2d');
cx.fillStyle='rgba(0,0,0,0)'; cx.fillRect(0,0,512,160);
cx.font='bold 110px Georgia,serif'; cx.textAlign='center'; cx.textBaseline='middle';
cx.shadowColor='#7fe8a8'; cx.shadowBlur=26;
cx.fillStyle='#aef5c8'; cx.fillText('MIDAS',256,84);
const holoTex = new THREE.CanvasTexture(cv);
const holo = new THREE.Mesh(new THREE.PlaneGeometry(2.6,0.8),
  new THREE.MeshBasicMaterial({map:holoTex,transparent:true,opacity:0.9,side:THREE.DoubleSide,depthWrite:false}));
holo.position.set(0,3.1,0); scene.add(holo);
const holoRing = new THREE.Mesh(new THREE.TorusGeometry(1.5,0.015,8,64),
  new THREE.MeshBasicMaterial({color:0x7fe8a8,transparent:true,opacity:0.35}));
holoRing.rotation.x=Math.PI/2; holoRing.position.set(0,2.6,0); scene.add(holoRing);
const holoLight = new THREE.PointLight(0x66e8a0, 6, 7, 2); holoLight.position.set(0,2.9,0); scene.add(holoLight);

// ---------- lights ----------
scene.add(new THREE.AmbientLight(0x3a3528, 0.9));
const hemi = new THREE.HemisphereLight(0x4a4438, 0x1a140c, 0.5); scene.add(hemi);
const screenGlow = new THREE.PointLight(0x4fae72, 8, 6, 2);
screenGlow.position.set(0,1.8,-0.4); scene.add(screenGlow);
const fill = new THREE.DirectionalLight(0x8a90a0, 0.35);
fill.position.set(6,8,6); scene.add(fill);

// ---------- fake blob shadows ----------
const blobMat = new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.3,depthWrite:false});
function blob(x,z,r){
  const b = new THREE.Mesh(new THREE.CircleGeometry(r,20), blobMat);
  b.rotation.x=-Math.PI/2; b.position.set(x,0.015,z); scene.add(b);
}
blob(-0.6,1.5,0.5); blob(2.6,2.2,0.5); blob(0,0,2.8); blob(-6.3,5.8,0.5); blob(5.8,-5.8,0.45);

// ---------- input ----------
const keys = {};
addEventListener('keydown',e=>{keys[e.code]=true;
  if(e.code==='KeyQ') yaw += Math.PI/12;
  if(e.code==='KeyE') yaw -= Math.PI/12;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup',e=>keys[e.code]=false);
// gentle drag orbit (no pointer capture)
let dragging=false,px=0;
addEventListener('mousedown',e=>{dragging=true;px=e.clientX;});
addEventListener('mouseup',()=>dragging=false);
addEventListener('mousemove',e=>{ if(dragging){ yaw -= (e.clientX-px)*0.004; px=e.clientX; }});

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

// ---------- animate ----------
const clockT = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clockT.getElapsedTime();
  const dt = Math.min(clockT.getDelta()+0.016,0.05);

  // pan
  const sp = 0.09;
  const fx = -Math.sin(yaw), fz = -Math.cos(yaw);
  const rx =  Math.cos(yaw), rz = -Math.sin(yaw);
  if(keys['KeyW']||keys['ArrowUp'])   { target.x+=fx*sp; target.z+=fz*sp; }
  if(keys['KeyS']||keys['ArrowDown']) { target.x-=fx*sp; target.z-=fz*sp; }
  if(keys['KeyA']||keys['ArrowLeft']) { target.x-=rx*sp; target.z-=rz*sp; }
  if(keys['KeyD']||keys['ArrowRight']){ target.x+=rx*sp; target.z+=rz*sp; }
  target.x = THREE.MathUtils.clamp(target.x,-5,5);
  target.z = THREE.MathUtils.clamp(target.z,-5,5);
  updateCam();

  // typing agent
  typer.armL.rotation.x = -1.1 + Math.sin(t*11)*0.12;
  typer.armR.rotation.x = -1.1 + Math.sin(t*11+Math.PI)*0.12;
  typer.head.rotation.x = 0.15 + Math.sin(t*1.3)*0.04;
  // idle breathing
  idler.body.scale.y = 1 + Math.sin(t*1.6)*0.02;
  idler.head.position.y = 1.5 + Math.sin(t*1.6)*0.015;
  idler.g.rotation.y = -2.2 + Math.sin(t*0.4)*0.15;

  // candle flicker
  for(const s of screens){
    s.face.material.emissiveIntensity = 1.3 + Math.sin(t*3+s.candles[0].ph)*0.15;
    for(const c of s.candles){
      const h = 0.08+Math.abs(Math.sin(t*0.8+c.ph))*0.3;
      c.m.scale.y = h/0.2; c.m.position.y = 0.68+h/2;
    }
  }
  for(const b of tickerBits) b.m.visible = Math.sin(t*2+b.ph)>-0.6;

  // holo
  holo.lookAt(camera.position.x, holo.position.y, camera.position.z);
  holo.material.opacity = 0.75+Math.sin(t*2.2)*0.15;
  holoRing.rotation.z = t*0.4;
  holoLight.intensity = 5+Math.sin(t*2.2)*1.5;

  // clock hands
  minH.rotation.z = -t*0.05; hourH.rotation.z = -t*0.005-1;

  // steam
  steam.position.y = 1.35 + (t*0.15)%0.3;
  steam.material.opacity = 0.15*(1-((t*0.15)%0.3)/0.3);

  renderer.render(scene,camera);
}
animate();
})();
</script>
</body>
</html>
