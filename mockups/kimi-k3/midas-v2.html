const DIST = 15, PITCH = THREE.MathUtils.degToRad(42);
function updateCam(){
  const h = Math.cos(PITCH)*DIST, v = Math.sin(PITCH)*DIST;
  camera.position.set(target.x + Math.sin(yaw)*h, target.y + v, target.z + Math.cos(yaw)*h);
  camera.lookAt(target);
}

function box(w,h,d,mat,x,y,z,ry=0,parent=scene){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); m.rotation.y = ry; m.castShadow = m.receiveShadow = true;
  parent.add(m); return m;
}
function cyl(rt,rb,h,mat,x,y,z,seg=16,parent=scene){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat);
  m.position.set(x,y,z); m.castShadow = m.receiveShadow = true; parent.add(m); return m;

// ---------- name tags ----------
function makeTag(text){
  const c = document.createElement('canvas'); c.width=512; c.height=128;
  const g = c.getContext('2d');
  g.fillStyle='rgba(10,14,12,0.92)';
  g.beginPath(); g.roundRect(8,20,496,88,18); g.fill();
  g.strokeStyle='#c9962e'; g.lineWidth=5; g.stroke();
  g.fillStyle='#e8f0e0'; g.font='bold 52px Georgia'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText(text, 256, 66);
  const tex = new THREE.CanvasTexture(c); tex.anisotropy=4;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, depthTest:false}));
  sp.scale.set(1.5,0.375,1); sp.renderOrder=99;
  return sp;
}

// ---------- agents: 4 distinct alien species ----------
const agents = [];

// 1) midas — tall mantis-like, horned head crest, thin limbs (orchestrator)
function buildMantis(){
  const g = new THREE.Group();
  const skin = new THREE.MeshStandardMaterial({color:0x7fae6a, roughness:0.6});
  const skin2 = new THREE.MeshStandardMaterial({color:0x5d8a4c, roughness:0.6});
  cyl(0.16,0.24,0.9, skin, 0,0.95,0, 10, g);                    // torso
  const head = new THREE.Mesh(new THREE.ConeGeometry(0.2,0.5,8), skin2);
  head.position.set(0,1.65,0); head.rotation.x=0.3; head.castShadow=true; g.add(head);
  // horn crest
  const horn = new THREE.Mesh(new THREE.ConeGeometry(0.06,0.45,6), M.brass);
  horn.position.set(0,1.95,-0.05); horn.rotation.x=-0.5; horn.castShadow=true; g.add(horn);
  // eyes
  for(const s of [-1,1]){
    const e = new THREE.Mesh(new THREE.SphereGeometry(0.07,10,10), new THREE.MeshStandardMaterial({color:0x111111, emissive:0xffe080, emissiveIntensity:0.6}));
    e.position.set(0.12*s,1.7,0.14); g.add(e);
  }
  // thin arms, one raised to board
  for(const s of [-1,1]){
    const a = cyl(0.035,0.03,0.7, skin2, 0.24*s, 1.25, 0.1, 6, g);
    a.rotation.z = s*0.5; a.rotation.x = s<0 ? -1.1 : -0.3;
  }
  for(const s of [-1,1]) cyl(0.04,0.05,0.6, skin2, 0.12*s, 0.3, 0, 6, g);
  return g;
}
// 2) midas-cio — squat crab-like builder, 4 arms, shell (builder bench)
function buildCrab(){
  const g = new THREE.Group();
  const shell = new THREE.MeshStandardMaterial({color:0xb05a2a, roughness:0.5});
  const skin = new THREE.MeshStandardMaterial({color:0x8a4520, roughness:0.7});
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.42,14,10,0,Math.PI*2,0,Math.PI/2), shell);
  body.position.y=0.55; body.scale.set(1.3,0.8,1); body.castShadow=true; g.add(body);
  // eye stalks
  for(const s of [-1,1]){
    cyl(0.02,0.02,0.3, skin, 0.15*s, 0.95, 0.25, 6, g);
    const e = new THREE.Mesh(new THREE.SphereGeometry(0.06,8,8), new THREE.MeshStandardMaterial({color:0x111111, emissive:0x66ffe0, emissiveIntensity:0.8}));
    e.position.set(0.15*s,1.12,0.25); g.add(e);
  }
  // 4 arms
  for(let i=0;i<4;i++){
    const s = i%2?1:-1, up = i<2?0.35:0.15;
    const a = cyl(0.045,0.035,0.55, skin, 0.5*s, 0.55+up, 0.15, 6, g);
    a.rotation.z = s*(1.0+i*0.2); a.rotation.x = -0.6;
  }
  // claw
  const claw = new THREE.Mesh(new THREE.SphereGeometry(0.12,8,8), shell);
  claw.position.set(-0.75,0.85,0.35); claw.scale.set(1,0.6,1.4); claw.castShadow=true; g.add(claw);
  for(const s of [-1,1]) cyl(0.05,0.06,0.4, skin, 0.25*s, 0.2, 0, 6, g);
  return g;
}
// 3) midas-research — slender frilled serpent alien, long neck + tail (reviewer)
function buildSerpent(){
  const g = new THREE.Group();
  const skin = new THREE.MeshStandardMaterial({color:0x5a7fae, roughness:0.55});
  const frillM = new THREE.MeshStandardMaterial({color:0x8fb8e8, roughness:0.4, side:THREE.DoubleSide});
  // coiled tail base
  const tail = new THREE.Mesh(new THREE.TorusGeometry(0.35,0.11,8,18), skin);
  tail.rotation.x=Math.PI/2; tail.position.y=0.12; tail.castShadow=true; g.add(tail);
  cyl(0.13,0.18,0.7, skin, 0,0.6,0, 10, g);                    // body
  const neck = cyl(0.08,0.11,0.6, skin, 0,1.25,0.05, 8, g); neck.rotation.x=0.15;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.16,12,10), skin);
  head.position.set(0,1.62,0.14); head.scale.set(0.9,1,1.3); head.castShadow=true; g.add(head);
  // frill fan
  const frill = new THREE.Mesh(new THREE.CircleGeometry(0.32,10,Math.PI*0.15,Math.PI*0.7), frillM);
  frill.position.set(0,1.66,-0.02); frill.rotation.y=Math.PI; g.add(frill);
  for(const s of [-1,1]){
    const e = new THREE.Mesh(new THREE.SphereGeometry(0.045,8,8), new THREE.MeshStandardMaterial({color:0x0a0a0a, emissive:0xff6a6a, emissiveIntensity:0.9}));
    e.position.set(0.08*s,1.66,0.3); g.add(e);
    const a = cyl(0.03,0.025,0.5, skin, 0.18*s, 0.95, 0.15, 6, g);
    a.rotation.z=s*0.7; a.rotation.x=-0.9;
  }
  return g;
}
// 4) midas-monitor — blobby asymmetric three-eyed alien, seated on couch (idle)
function buildBlob(){
  const g = new THREE.Group();
  const skin = new THREE.MeshStandardMaterial({color:0x9a6fae, roughness:0.4});
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.42,16,12), skin);
  body.position.y=0.42; body.scale.set(1.1,0.95,1); body.castShadow=true; g.add(body);
  // asymmetric head lump
  const lump = new THREE.Mesh(new THREE.SphereGeometry(0.22,12,10), skin);
  lump.position.set(0.18,0.85,0.05); lump.castShadow=true; g.add(lump);
  // three eyes, uneven
  const eyeM = new THREE.MeshStandardMaterial({color:0x111111, emissive:0xaaffcc, emissiveIntensity:0.8});
  const e1 = new THREE.Mesh(new THREE.SphereGeometry(0.07,8,8), eyeM); e1.position.set(0.22,0.92,0.22); g.add(e1);
  const e2 = new THREE.Mesh(new THREE.SphereGeometry(0.05,8,8), eyeM); e2.position.set(0.02,0.86,0.28); g.add(e2);
  const e3 = new THREE.Mesh(new THREE.SphereGeometry(0.04,8,8), eyeM); e3.position.set(0.34,0.78,0.18); g.add(e3);
  // antenna
  cyl(0.015,0.015,0.35, skin, 0.18, 1.15, 0.05, 6, g).rotation.z=0.3;
  const tip = new THREE.Mesh(new THREE.SphereGeometry(0.045,8,8), new THREE.MeshStandardMaterial({color:0x222, emissive:0xffe080, emissiveIntensity:1}));
  tip.position.set(0.28,1.32,0.05); g.add(tip);
  // stubby arms
  for(const s of [-1,1]){ const a = cyl(0.05,0.04,0.35, skin, 0.42*s, 0.45, 0.15, 6, g); a.rotation.z=s*1.2; }
  return g;
}

function placeAgent(builder, name, x, z, ry, tagH, y=0){
  const g = builder();
  g.position.set(x,y,z); g.rotation.y = ry;
  scene.add(g);
  const tag = makeTag(name); tag.position.set(x, y+tagH, z); scene.add(tag);
  agents.push({g, tag, baseY:y, phase:Math.random()*6});
  return g;
}
placeAgent(buildMantis,  'midas',          -4.4, -4.6, Math.PI,       2.3);          // facing board
placeAgent(buildCrab,    'midas-cio',       4.5, -3.5, Math.PI,       1.7);          // facing bench

placeAgent(buildBlob,    'midas-monitor',   5.6,  3.55, 0,            1.9, 0.55);    // seated on couch

// ---------- in-room hologram: MIDAS ----------
const holoC = document.createElement('canvas'); holoC.width=512; holoC.height=160;
const hg = holoC.getContext('2d');
hg.fillStyle='#2fd8c8'; hg.font='bold 96px Georgia'; hg.textAlign='center'; hg.textBaseline='middle';
hg.shadowColor='#2fd8c8'; hg.shadowBlur=24; hg.fillText('M I D A S', 256, 84);
const holoTex = new THREE.CanvasTexture(holoC);
const holo = new THREE.Sprite(new THREE.SpriteMaterial({map:holoTex, transparent:true, opacity:0.85, depthWrite:false}));
holo.scale.set(3.2,1,1); holo.position.set(0,3.1,-2.5); scene.add(holo);

// ---------- controls ----------
const keys = {};
addEventListener('keydown', e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',   e=>keys[e.key.toLowerCase()]=false);
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  const sp = 5*dt;
  const f = new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  const r = new THREE.Vector3(f.z,0,-f.x);
  if(keys['w']||keys['arrowup'])    target.addScaledVector(f, sp);
  if(keys['s']||keys['arrowdown'])  target.addScaledVector(f,-sp);
  if(keys['a']||keys['arrowleft'])  target.addScaledVector(r,-sp);
  if(keys['d']||keys['arrowright']) target.addScaledVector(r, sp);
  if(keys['q']) yaw += 1.2*dt;
  if(keys['e']) yaw -= 1.2*dt;
  target.x = THREE.MathUtils.clamp(target.x,-5,5);
  target.z = THREE.MathUtils.clamp(target.z,-4,4);
  updateCam();

  // idle life
  for(const a of agents){
    a.g.position.y = a.baseY + Math.sin(t*1.6+a.phase)*0.02;
    a.tag.position.y = a.baseY + (a.g===agents[3].g?1.9:a.tag.position.y-a.baseY)*1; // keep
  }
  agents[0].g.rotation.y = Math.PI + Math.sin(t*0.7)*0.12;      // midas gestures at board
  agents[2].g.rotation.y = Math.PI+0.25 + Math.sin(t*0.5)*0.15; // research sways
  holo.material.opacity = 0.7 + Math.sin(t*2.2)*0.15;
  holo.position.y = 3.1 + Math.sin(t*1.1)*0.05;
  ticker.material.emissiveIntensity = 0.5 + Math.abs(Math.sin(t*3))*0.4;

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
