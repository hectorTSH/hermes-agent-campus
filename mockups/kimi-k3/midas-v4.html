<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Midas · Project Room v4</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0d0c;font-family:Georgia,serif;}
  canvas#c{display:block;}
  #hud{position:fixed;top:14px;left:16px;color:#e8d9a8;z-index:10;pointer-events:none;
       text-shadow:0 1px 3px #000;}
  #hud h1{margin:0;font-size:20px;letter-spacing:2px;color:#d4af37;}
  #hud p{margin:2px 0 0;font-size:11px;color:#9fb8a4;letter-spacing:1px;}
  #keys{position:fixed;bottom:12px;left:16px;color:#6f7f72;font-size:11px;z-index:10;pointer-events:none;letter-spacing:1px;}
  #toast{position:fixed;bottom:36px;left:50%;transform:translateX(-50%);z-index:30;
         background:rgba(10,14,12,.92);color:#e8d9a8;border:1px solid #c9962e;padding:8px 14px;
         font-size:12px;letter-spacing:1px;opacity:0;transition:opacity .25s;pointer-events:none;}
  #toast.show{opacity:1;}
  #inspector{
    position:fixed;top:16px;right:16px;width:340px;z-index:20;display:none;
    background:rgba(12,16,14,.94);color:#e8efe6;border:1px solid #c9962e;
    box-shadow:0 12px 40px rgba(0,0,0,.45);padding:14px 16px 12px;
  }
  #inspector.open{display:block;}
  #inspector h2{margin:0 28px 2px 0;font-size:16px;color:#d4af37;letter-spacing:1px;}
  #inspector .status{font-size:11px;letter-spacing:1px;margin-bottom:10px;}
  #inspector .status.working{color:#2fd8c8;}
  #inspector .status.idle{color:#9fb8a4;}
  #inspector dl{margin:0;display:grid;grid-template-columns:88px 1fr;gap:6px 10px;font-size:12px;}
  #inspector dt{color:#8a9a88;font-weight:normal;}
  #inspector dd{margin:0;color:#e8efe6;word-break:break-word;}
  #inspector .hint{margin:12px 0 0;font-size:10px;color:#6f7f72;letter-spacing:.4px;}
  #insp-close{position:absolute;top:8px;right:10px;background:transparent;border:0;color:#e8d9a8;
              font-size:18px;cursor:pointer;line-height:1;}
  #warp{position:fixed;inset:0;z-index:40;display:none;background:#020508;}
  #warp.active{display:block;}
  #warp canvas{width:100%;height:100%;display:block;}
  #warp .cap{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);
             color:#e8fff8;font:14px/1.4 Georgia;letter-spacing:4px;text-shadow:0 0 18px #2fd8c8;
             pointer-events:none;text-align:center;}
</style>
</head>
<body>
<div id="hud"><h1>MIDAS</h1><p>Robinhood Agentic Trading · v4</p></div>
<div id="keys">WASD / arrows pan (A/D inverted) · Q/E yaw · click tag · click door to warp</div>
<div id="toast"></div>
<aside id="inspector" aria-hidden="true">
  <button id="insp-close" type="button" aria-label="Close">×</button>
  <h2 id="insp-name">—</h2>
  <div id="insp-status" class="status">—</div>
  <dl id="insp-dl"></dl>
  <p class="hint">Second click to expand run history — later.</p>
</aside>
<div id="warp" aria-hidden="true">
  <canvas id="warp-c"></canvas>
  <div class="cap">WARP<br><span style="font-size:11px;letter-spacing:2px;opacity:.7">CAMPUS DOOR · MOCK</span></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d100e);
scene.fog = new THREE.Fog(0x0d100e, 12, 28);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 100);
let yaw = 0;
const target = new THREE.Vector3(0, 0.55, 0.4);
const DIST = 12.2, PITCH = THREE.MathUtils.degToRad(36);
function updateCam(){
  const h = Math.cos(PITCH)*DIST, v = Math.sin(PITCH)*DIST;
  camera.position.set(target.x + Math.sin(yaw)*h, target.y + v, target.z + Math.cos(yaw)*h);
  camera.lookAt(target);
}
updateCam();

const renderer = new THREE.WebGLRenderer({antialias:true, canvas: Object.assign(document.createElement('canvas'), {id:'c'})});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const M = {
  walnut:  new THREE.MeshStandardMaterial({color:0x4a2f1d, roughness:0.7}),
  walnutD: new THREE.MeshStandardMaterial({color:0x33200f, roughness:0.8}),
  brass:   new THREE.MeshStandardMaterial({color:0xc9962e, roughness:0.3, metalness:0.85}),
  green:   new THREE.MeshStandardMaterial({color:0x1e4d33, roughness:0.85}),
  leather: new THREE.MeshStandardMaterial({color:0x5a3a22, roughness:0.6}),
  dark:    new THREE.MeshStandardMaterial({color:0x14181a, roughness:0.5}),
  paper:   new THREE.MeshStandardMaterial({color:0xe8e0cc, roughness:0.9}),
  wall:    new THREE.MeshStandardMaterial({color:0x22302a, roughness:0.95}),
  screen:  new THREE.MeshStandardMaterial({color:0x0a1418, emissive:0x2fd8c8, emissiveIntensity:0.9}),
  screenA: new THREE.MeshStandardMaterial({color:0x0a1418, emissive:0xffb347, emissiveIntensity:0.8}),
  chalk:   new THREE.MeshStandardMaterial({color:0x101a14, roughness:0.9}),
};
function box(w,h,d,mat,x,y,z,ry=0,parent=scene){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); m.rotation.y = ry; m.castShadow = m.receiveShadow = true;
  parent.add(m); return m;
}
function cyl(rt,rb,h,mat,x,y,z,seg=16,parent=scene){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat);
  m.position.set(x,y,z); m.castShadow = m.receiveShadow = true; parent.add(m); return m;
}
function makeChartTex(seed, w=256, h=160, accent='#3dd68c'){
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const g = c.getContext('2d');
  g.fillStyle='#06140f'; g.fillRect(0,0,w,h);
  g.strokeStyle='#163828'; g.lineWidth=1;
  for(let x=0;x<w;x+=24){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,h); g.stroke(); }
  for(let y=0;y<h;y+=20){ g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke(); }
  let p = h*0.55;
  const gap = (w-16)/16;
  for(let i=0;i<16;i++){
    const n = ((Math.sin(seed*0.7+i*0.63)+1)*0.5);
    const body = 6+n*22;
    const up = ((seed*11+i*17)%10)>4;
    const col = up ? accent : '#e07070';
    const top = p - (up?body:0);
    g.fillStyle = col;
    g.fillRect(10+i*gap, top, gap*0.45, body);
    g.fillRect(10+i*gap+gap*0.18, top-8-n*6, 2, body+16+n*8);
    p += (up?-1:1)*(2+n*4);
    p = Math.max(28, Math.min(h-20, p));
  }
  g.fillStyle=accent; g.font='bold 11px monospace'; g.fillText('MIDAS  ·  PAPER', 8, 14);
  const tex = new THREE.CanvasTexture(c); tex.anisotropy=4; return tex;
}
function chartPlane(w,h,x,y,z,ry,seed,parent,accent){
  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(w,h),
    new THREE.MeshBasicMaterial({map: makeChartTex(seed, 256, 160, accent)})
  );
  mesh.position.set(x,y,z); mesh.rotation.y = ry; mesh.castShadow=false;
  parent.add(mesh); return mesh;
}

// tighter floor (14×10 vs v2 16×12)

for(let i=0;i<14;i++) for(let j=0;j<10;j++){

}
scene.add(floor);

const termScreen = box(0.9,0.6,0.02, M.screenA, 3.35, 1.7, -4.25, 0.15, bench);
termScreen.castShadow=false;

for(let i=0;i<8;i++) box(0.1,0.03,0.1, M.brass, 3.35+i*0.12, 1.08, -3.6, 0, bench).castShadow=false;
box(0.5,0.05,0.1, M.brass, 4.85, 1.04, -3.75, 0.5, bench);

cyl(0.12,0.16,0.06, M.brass, 2.7, 1.04, -4.15, 12, bench);
cyl(0.02,0.02,0.6, M.brass, 2.7, 1.35, -4.15, 8, bench);
box(0.22,0.12,0.14, M.brass, 2.85, 1.66, -4.05, 0.4, bench);

// ZONE 3 reviewer
const rev = new THREE.Group(); scene.add(rev);
box(2.4,0.1,1.1, M.walnut, -4.7, 0.9, -0.35, 0.2, rev);
for(const [x,z] of [[-5.7,-0.8],[-3.7,0.1],[-5.65,0.1],[-3.8,-0.8]]) cyl(0.05,0.05,0.9, M.walnutD, x,0.45,z,8,rev);
const scrL = box(0.8,0.55,0.06, M.dark, -5.2, 1.52, -0.75, 0.5, rev);

chartPlane(0.64,0.40, -5.16, 1.52, -0.68, 0.5, 7.2, rev, '#3dd68c');
const scrR = box(0.8,0.55,0.06, M.dark, -4.25, 1.52, -0.85, 0.08, rev);
const scrRF = box(0.68,0.44,0.02, M.screen, -4.25, 1.52, -0.8, 0.08, rev); scrRF.castShadow=false;
chartPlane(0.64,0.40, -4.25, 1.52, -0.78, 0.08, 11.4, rev, '#e0c36a');

cyl(0.05,0.05,0.14, M.brass, -4.05, 1.02, -0.15, 10, rev);

plant.position.set(-5.35,0.52,3.35); plant.castShadow=true; scene.add(plant);

doorGroup.userData.kind = 'door';
const doorLeaf = box(1.25,2.35,0.14, M.walnutD, 0.15, 1.18, -5.35, 0, doorGroup);
box(1.45,0.1,0.2, M.brass, 0.15, 2.4, -5.33, 0, doorGroup);

doorGlow.castShadow=false;

ticker.castShadow=false;

for(let i=0;i<3;i++){
  box(1.15,0.72,0.06, M.dark, 2.2+i*1.22, 2.05, -5.32);

box(1.15,1.25,0.08, M.brass, 6.35, 0.82, 0.1, 0, vault);
cyl(0.16,0.16,0.06, M.brass, 6.35, 0.85, 0.16, 16, vault);
cyl(0.04,0.04,0.08, M.dark, 6.55, 1.15, 0.14, 8, vault);
box(1.4,0.08,0.9, M.walnutD, 6.35, 0.04, -0.35, 0, vault);
function moneyBag(x,z,s=1){
  const g = new THREE.Group(); scene.add(g);
  const sack = new THREE.Mesh(new THREE.SphereGeometry(0.26*s,12,10), new THREE.MeshStandardMaterial({color:0x6b5428, roughness:0.85}));
  sack.position.set(x, 0.26*s, z); sack.scale.set(1,1.2,1); sack.castShadow=true; g.add(sack);
  cyl(0.07*s,0.11*s,0.1*s, M.walnutD, x, 0.52*s, z, 8, g);
  const c = document.createElement('canvas'); c.width=128; c.height=128;
  const ctx=c.getContext('2d'); ctx.fillStyle='#c9962e'; ctx.font='bold 90px Georgia'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('$',64,70);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c), transparent:true}));
  sp.scale.set(0.22*s,0.22*s,1); sp.position.set(x, 0.3*s, z+0.22*s); g.add(sp);
  return g;
}
moneyBag(5.55, 0.15, 1);

for(let i=0;i<6;i++){
  const bar = box(0.34,0.08,0.16, M.brass, 4.85+(i%3)*0.38, 0.08+Math.floor(i/3)*0.1, -0.15);

box(2.8,0.025,2.2, new THREE.MeshStandardMaterial({color:0x2a3f33, roughness:0.95}), 0, 0.015, -2.0);

const warm = new THREE.PointLight(0xffd9a0, 26, 16); warm.position.set(0,3.1,0); warm.castShadow=true; scene.add(warm);

  cyl(0.16,0.24,0.2, new THREE.MeshStandardMaterial({color:0x2a2a2a, emissive:0xffd9a0, emissiveIntensity:0.9}), x, 3.28, -0.8, 12);
}

function makeTag(text, working){
  const c = document.createElement('canvas'); c.width=512; c.height=144;
  const g = c.getContext('2d');
  g.fillStyle='rgba(10,14,12,0.92)';
  g.beginPath(); g.roundRect(8,16,496,112,16); g.fill();
  g.strokeStyle = working ? '#2fd8c8' : '#c9962e'; g.lineWidth=5; g.stroke();
  g.fillStyle = working ? '#2fd8c8' : '#9fb8a4';
  g.font='bold 22px Georgia'; g.textAlign='left'; g.textBaseline='middle';
  g.fillText(working ? '● LIVE' : '○ IDLE', 28, 44);
  g.fillStyle='#e8f0e0'; g.font='bold 44px Georgia'; g.textAlign='center';
  g.fillText(text, 256, 96);
  const tex = new THREE.CanvasTexture(c); tex.anisotropy=4;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, depthTest:false}));
  sp.scale.set(1.55,0.44,1); sp.renderOrder=99;
  sp.userData.kind = 'tag';
  return sp;

function setMouse(e){
  const r = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX-r.left)/r.width)*2-1;
  mouse.y = -((e.clientY-r.top)/r.height)*2+1;
}
function pick(e){
  setMouse(e);
  raycaster.setFromCamera(mouse, camera);

function showInspector(name){

let warping = false;
function startWarp(){
  if(warping) return;
  warping = true;
  hideInspector();
  const overlay = document.getElementById('warp');
  const cv = document.getElementById('warp-c');
  overlay.classList.add('active');
  overlay.setAttribute('aria-hidden','false');
  const ctx = cv.getContext('2d');
  const dpr = Math.min(devicePixelRatio,2);
  function size(){ cv.width = innerWidth*dpr; cv.height = innerHeight*dpr; }
  size();
  const streaks = Array.from({length:90}, ()=>({
    a: Math.random()*Math.PI*2,
    r: 4+Math.random()*40,
    v: 8+Math.random()*22,
    w: 1+Math.random()*2.5,
  }));
  const t0 = performance.now();
  function frame(now){
    const u = Math.min(1, (now-t0)/1800);
    const W = cv.width, H = cv.height, cx=W/2, cy=H/2;
    ctx.fillStyle = `rgba(4,8,12,${0.25+u*0.2})`;
    ctx.fillRect(0,0,W,H);
    const grd = ctx.createRadialGradient(cx,cy,10,cx,cy,Math.max(W,H)*0.55);
    grd.addColorStop(0, `rgba(180,255,240,${0.15+u*0.45})`);
    grd.addColorStop(0.35, `rgba(47,216,200,${0.12})`);
    grd.addColorStop(1, 'rgba(2,5,8,0)');
    ctx.fillStyle = grd; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle = '#e8fff8';
    streaks.forEach(s=>{
      s.r += s.v * (1.2+u*3);
      if(s.r > Math.max(W,H)) s.r = 6;
      const x0 = cx + Math.cos(s.a)*s.r;
      const y0 = cy + Math.sin(s.a)*s.r;
      const x1 = cx + Math.cos(s.a)*(s.r + 28+u*80);
      const y1 = cy + Math.sin(s.a)*(s.r + 28+u*80);
      ctx.globalAlpha = 0.35+u*0.55;
      ctx.lineWidth = s.w * dpr;
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
    });
    ctx.globalAlpha = 1;
    if(u<1) requestAnimationFrame(frame);
    else {
      overlay.classList.remove('active');
      overlay.setAttribute('aria-hidden','true');
      warping = false;
      toast('same room · mock warp (Campus door not wired yet)');
    }
  }
  requestAnimationFrame(frame);
}

renderer.domElement.addEventListener('mousemove', e=>{
  if(warping){ renderer.domElement.style.cursor='default'; return; }
  const hit = pick(e);
  const kind = hit && (hit.object.userData.kind || (hit.object.parent && hit.object.parent.userData.kind));
  hovering = !!(kind==='tag' || kind==='door');
  renderer.domElement.style.cursor = hovering ? 'pointer' : 'default';
});
renderer.domElement.addEventListener('click', e=>{
  if(warping) return;
  const hit = pick(e);
  if(!hit){ hideInspector(); return; }
  let obj = hit.object;
  const kind = obj.userData.kind || (obj.parent && obj.parent.userData.kind);
  if(kind==='door'){ startWarp(); return; }
  if(kind==='tag'){
    const name = obj.userData.agentName;
    if(openName===name) hideInspector();
    else showInspector(name);
  }
});

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  const sp = 5*dt;
  const f = new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  const r = new THREE.Vector3(f.z,0,-f.x);
  if(!warping){
    if(keys['w']||keys['arrowup'])    target.addScaledVector(f, sp);
    if(keys['s']||keys['arrowdown'])  target.addScaledVector(f,-sp);
    // inverted A/D and left/right
    if(keys['a']||keys['arrowleft'])  target.addScaledVector(r, sp);
    if(keys['d']||keys['arrowright']) target.addScaledVector(r,-sp);
    if(keys['q']) yaw += 1.2*dt;
    if(keys['e']) yaw -= 1.2*dt;
    target.x = THREE.MathUtils.clamp(target.x,-4.2,4.2);
    target.z = THREE.MathUtils.clamp(target.z,-3.2,3.2);
    updateCam();
  }

  const midas = agents[0], cio = agents[1], research = agents[2], monitor = agents[3];
  const p0 = midas.g.userData.parts;
  p0.workArm.rotation.x = -1.05 + Math.sin(t*9)*0.35;
  p0.workArm.rotation.z = -0.45 + Math.sin(t*4.5)*0.12;
  p0.head.rotation.y = Math.sin(t*2.2)*0.12;
  chalkBit.position.x = -3.7 + Math.sin(t*9)*0.55;
  chalkBit.position.y = 2.15 + Math.cos(t*7)*0.28;
  midas.g.rotation.y = midas.g.userData.baseRotY + Math.sin(t*1.4)*0.06;

  const p1 = cio.g.userData.parts;
  p1.claw.position.y = 0.85 + Math.abs(Math.sin(t*10))*0.12;
  p1.claw.position.z = 0.35 + Math.sin(t*10)*0.08;
  p1.arms.forEach((a,i)=>{ a.rotation.x = -0.5 + Math.sin(t*8+i)*0.4; });
  spark.intensity = 4 + Math.abs(Math.sin(t*14))*10;
  termScreen.material.emissiveIntensity = 0.55 + Math.abs(Math.sin(t*6))*0.5;

  const p2 = research.g.userData.parts;
  p2.neck.rotation.x = 0.1 + Math.sin(t*3.2)*0.18;
  p2.head.rotation.y = Math.sin(t*2.6)*0.22;
  p2.arms[0].rotation.x = -0.7 + Math.sin(t*5)*0.35;
  scrLF.material.emissiveIntensity = 0.7 + Math.abs(Math.sin(t*5.5))*0.5;
  scrRF.material.emissiveIntensity = 0.7 + Math.abs(Math.sin(t*4.1+1))*0.5;
  research.g.rotation.y = research.g.userData.baseRotY + Math.sin(t*0.8)*0.05;

  const p3 = monitor.g.userData.parts;
  const breathe = 1 + Math.sin(t*1.15)*0.03;
  p3.body.scale.set(1.1*breathe, 0.95*breathe, breathe);
  monitor.g.rotation.y = 0.08;
  monitor.g.position.y = monitor.baseY + Math.sin(t*1.15)*0.01;

  holo.material.opacity = 0.7 + Math.sin(t*2.2)*0.15;
  ticker.material.emissiveIntensity = 0.5 + Math.abs(Math.sin(t*3))*0.4;
  doorGlow.material.emissiveIntensity = hovering ? 1.2 : 0.7;

  renderer.render(scene, camera);
}
