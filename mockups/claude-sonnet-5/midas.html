<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Midas</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#0a0806;}
  canvas{display:block;}
  #hud{
    position:fixed;top:8px;left:10px;color:#c9d9c9;
    font-family:'Courier New',monospace;font-size:13px;
    letter-spacing:1px;text-shadow:0 0 4px #000;
    pointer-events:none; z-index:10; opacity:0.85;
  }
</style>
</head>
<body>
<div id="hud">Midas · generated by openrouter/claude-sonnet-5</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function(){
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0906);
  scene.fog = new THREE.FogExp2(0x0b0906, 0.028);

  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const camera = new THREE.PerspectiveCamera(38, window.innerWidth/window.innerHeight, 0.1, 100);

  // camera rig
  let camTarget = new THREE.Vector3(0,1.2,0);
  let yaw = Math.PI*0.25;
  let pitch = THREE.MathUtils.degToRad(52);
  let dist = 15;

  function updateCamera(){
    const x = camTarget.x + dist*Math.cos(pitch)*Math.sin(yaw);
    const y = camTarget.y + dist*Math.sin(pitch);
    const z = camTarget.z + dist*Math.cos(pitch)*Math.cos(yaw);
    camera.position.set(x,y,z);
    camera.lookAt(camTarget);
  }
  updateCamera();

  window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ------ Controls ------
  const keys = {};
  window.addEventListener('keydown', e=>{ keys[e.key.toLowerCase()] = true; });
  window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });

  let dragging = false, lastX=0, lastY=0;
  renderer.domElement.addEventListener('mousedown', e=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; });
  window.addEventListener('mouseup', ()=> dragging=false);
  window.addEventListener('mousemove', e=>{
    if(!dragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    yaw -= dx*0.004;
    pitch += dy*0.002;
    pitch = THREE.MathUtils.clamp(pitch, THREE.MathUtils.degToRad(35), THREE.MathUtils.degToRad(75));
  });

  let qeCooldown = 0;

  function handleInput(dt){
    const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
    const right = new THREE.Vector3(Math.sin(yaw+Math.PI/2), 0, Math.cos(yaw+Math.PI/2));
    const speed = 6*dt;
    let mv = new THREE.Vector3();
    if(keys['w']||keys['arrowup']) mv.addScaledVector(forward, -speed);
    if(keys['s']||keys['arrowdown']) mv.addScaledVector(forward, speed);
    if(keys['a']||keys['arrowleft']) mv.addScaledVector(right, -speed);
    if(keys['d']||keys['arrowright']) mv.addScaledVector(right, speed);
    camTarget.add(mv);
    camTarget.x = THREE.MathUtils.clamp(camTarget.x, -8, 8);
    camTarget.z = THREE.MathUtils.clamp(camTarget.z, -8, 8);

    qeCooldown -= dt;
    if(qeCooldown<=0){
      if(keys['q']){ yaw += THREE.MathUtils.degToRad(15); qeCooldown = 0.18; }
      if(keys['e']){ yaw -= THREE.MathUtils.degToRad(15); qeCooldown = 0.18; }
    }
  }

  // ------ Lighting ------
  const hemi = new THREE.HemisphereLight(0x445544, 0x100c08, 0.55);
  scene.add(hemi);

  const warmLamp = new THREE.PointLight(0xffb066, 1.4, 12, 2);
  warmLamp.position.set(-4.2, 3.0, -3.5);
  warmLamp.castShadow = true;
  scene.add(warmLamp);

  const warmLamp2 = new THREE.PointLight(0xffab5c, 0.9, 10, 2);
  warmLamp2.position.set(4.5, 2.6, 3.2);
  scene.add(warmLamp2);

  const coolFill = new THREE.PointLight(0x35ffb0, 0.9, 9, 2);
  coolFill.position.set(0, 1.9, -0.4);
  scene.add(coolFill);

  const dirLight = new THREE.DirectionalLight(0xfff0dd, 0.35);
  dirLight.position.set(5,8,4);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.set(1024,1024);
  scene.add(dirLight);

  // ------ Materials helpers ------
  function makeGridTexture(size, divisions, color1, color2, lineColor){
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    ctx.fillStyle = color1;
    ctx.fillRect(0,0,size,size);
    const step = size/divisions;
    for(let i=0;i<divisions;i++){
      for(let j=0;j<divisions;j++){
        if((i+j)%2===0){
          ctx.fillStyle = color2;
          ctx.fillRect(i*step, j*step, step, step);
        }
      }
    }
    ctx.strokeStyle = lineColor;
    ctx.lineWidth = 1;
    for(let i=0;i<=divisions;i++){
      ctx.beginPath(); ctx.moveTo(i*step,0); ctx.lineTo(i*step,size); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,i*step); ctx.lineTo(size,i*step); ctx.stroke();
    }
    return new THREE.CanvasTexture(c);
  }

  // ------ Floor: parquet + grid ------
  const floorTex = makeGridTexture(512, 16, '#3b2a1d', '#453224', 'rgba(0,0,0,0.25)');
  floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
  floorTex.repeat.set(2,2);
  const floorMat = new THREE.MeshStandardMaterial({map: floorTex, roughness:0.75, metalness:0.05});
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(20,20), floorMat);
  floor.rotation.x = -Math.PI/2;
  floor.receiveShadow = true;
  scene.add(floor);

  // subtle overlay grid lines (green tint) for terminal vibe
  const gridHelper = new THREE.GridHelper(20,20,0x2c4a3a,0x1c2b22);
  gridHelper.position.y = 0.01;
  gridHelper.material.opacity = 0.15;
  gridHelper.material.transparent = true;
  scene.add(gridHelper);

  // Rug under desk
  const rugMat = new THREE.MeshStandardMaterial({color:0x27352b, roughness:0.9});
  const rug = new THREE.Mesh(new THREE.CylinderGeometry(4.2,4.2,0.05,32), rugMat);
  rug.position.set(0,0.03,0);
  rug.receiveShadow = true;
  scene.add(rug);

  // ------ Walls (open toward camera) ------
  const wallMat = new THREE.MeshStandardMaterial({color:0x2a2018, roughness:0.85});
  const backWall = new THREE.Mesh(new THREE.BoxGeometry(20,7,0.3), wallMat);
  backWall.position.set(0,3.5,-9.85);
  backWall.receiveShadow = true;
  scene.add(backWall);

  const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.3,7,14), wallMat);
  leftWall.position.set(-9.85,3.5,-3);
  scene.add(leftWall);

  const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.3,7,14), wallMat);
  rightWall.position.set(9.85,3.5,-3);
  scene.add(rightWall);

  // wall trim brass strip
  const trimMat = new THREE.MeshStandardMaterial({color:0xb08a4e, metalness:0.7, roughness:0.35});
  const trim = new THREE.Mesh(new THREE.BoxGeometry(20,0.12,0.35), trimMat);
  trim.position.set(0, 1.4, -9.8);
  scene.add(trim);

  // ------ Far wall door ------
  const doorGroup = new THREE.Group();
  const doorFrame = new THREE.Mesh(new THREE.BoxGeometry(1.7,3.2,0.15), new THREE.MeshStandardMaterial({color:0x1c140d, roughness:0.6}));
  doorFrame.position.set(0,1.6,-9.75);
  doorGroup.add(doorFrame);
  const doorPanel = new THREE.Mesh(new THREE.BoxGeometry(1.4,2.9,0.08), new THREE.MeshStandardMaterial({color:0x4a3423, roughness:0.5, metalness:0.1}));
  doorPanel.position.set(0,1.5,-9.7);
  doorGroup.add(doorPanel);
  const doorHandle = new THREE.Mesh(new THREE.SphereGeometry(0.06,12,12), trimMat);
  doorHandle.position.set(0.55,1.4,-9.63);
  doorGroup.add(doorHandle);
  scene.add(doorGroup);

  // ------ Central island desk ------
  const deskGroup = new THREE.Group();
  const deskTopMat = new THREE.MeshStandardMaterial({color:0x3a2a1c, roughness:0.4, metalness:0.2});
  const deskTop = new THREE.Mesh(new THREE.BoxGeometry(4.4,0.18,2.2), deskTopMat);
  deskTop.position.set(0,1.05,0);
  deskTop.castShadow = true;
  deskTop.receiveShadow = true;
  deskGroup.add(deskTop);

  const deskBase = new THREE.Mesh(new THREE.BoxGeometry(4.0,1.0,1.8), new THREE.MeshStandardMaterial({color:0x241a12, roughness:0.6}));
  deskBase.position.set(0,0.5,0);
  deskBase.castShadow = true;
  deskGroup.add(deskBase);

  // brass edge trim
  const edge = new THREE.Mesh(new THREE.BoxGeometry(4.45,0.05,2.25), trimMat);
  edge.position.set(0,1.15,0);
  deskGroup.add(edge);

  scene.add(deskGroup);

  // ------ Monitors with candlestick data ------
  function makeCandleTexture(){
    const c = document.createElement('canvas');
    c.width=256; c.height=160;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#07120c';
    ctx.fillRect(0,0,256,160);
    ctx.strokeStyle = 'rgba(60,180,120,0.25)';
    for(let i=0;i<8;i++){
      ctx.beginPath(); ctx.moveTo(0,i*20); ctx.lineTo(256,i*20); ctx.stroke();
    }
    let y = 90;
    for(let x=8; x<250; x+=10){
      const open = y;
      const change = (Math.random()-0.45)*22;
      const close = y+change;
      const high = Math.min(open,close) - Math.random()*10;
      const low = Math.max(open,close) + Math.random()*10;
      ctx.strokeStyle = close<open ? '#4fffab' : '#ff6a5c';
      ctx.beginPath(); ctx.moveTo(x+3,high); ctx.lineTo(x+3,low); ctx.stroke();
      ctx.fillStyle = close<open ? '#3fe89a' : '#e85b4f';
      ctx.fillRect(x, Math.min(open,close), 6, Math.max(2,Math.abs(close-open)));
      y = close;
    }
    return new THREE.CanvasTexture(c);
  }

  const monitorPositions = [
    [-1.5, 1.55, -0.4, -0.15],
    [-0.5, 1.65, -0.42, -0.05],
    [0.5, 1.65, -0.42, 0.05],
    [1.5, 1.55, -0.4, 0.15]
  ];
  monitorPositions.forEach(p=>{
    const [x,y,z,rot] = p;
    const mGroup = new THREE.Group();
    const screenTex = makeCandleTexture();
    const screenMat = new THREE.MeshStandardMaterial({
      map: screenTex, emissive: 0x1c6b45, emissiveIntensity:1.1, emissiveMap: screenTex,
      roughness:0.3
    });
    const screen = new THREE.Mesh(new THREE.BoxGeometry(1.0,0.65,0.05), screenMat);
    screen.position.set(0,0.55,0);
    mGroup.add(screen);
    const frame = new THREE.Mesh(new THREE.BoxGeometry(1.08,0.73,0.08), new THREE.MeshStandardMaterial({color:0x111111, roughness:0.6}));
    frame.position.set(0,0.55,-0.02);
    mGroup.add(frame);
    const stand = new THREE.Mesh(new THREE.BoxGeometry(0.08,0.5,0.08), new THREE.MeshStandardMaterial({color:0x222222}));
    stand.position.set(0,0.25,0);
    mGroup.add(stand);
    mGroup.position.set(x,y-0.55,z);
    mGroup.rotation.y = rot;
    deskGroup.add(mGroup);

    const glow = new THREE.PointLight(0x36ffab, 0.5, 3);
    glow.position.set(x, y+0.2, z+0.4);
    deskGroup.add(glow);
  });

  // ------ Agent figures ------
  function makeAgent(x,z,rotY, typing){
    const g = new THREE.Group();
    const bodyMat = new THREE.MeshStandardMaterial({color: typing?0x394b5c:0x4b4436, roughness:0.6});
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.28,0.7,6,12), bodyMat);
    body.position.y = 0.75;
    body.castShadow = true;
    g.add(body);
    const headMat = new THREE.MeshStandardMaterial({color:0xd9c2a0, roughness:0.5});
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.24,16,16), headMat);
    head.position.y = 1.35;
    head.castShadow = true;
    g.add(head);
    // simple arms
    const armMat = bodyMat;
    const armL = new THREE.Mesh(new THREE.CapsuleGeometry(0.08,0.4,4,8), armMat);
    armL.position.set(-0.35,0.85,0.05);
    armL.rotation.z = typing? 0.4 : 0.15;
    g.add(armL);
    const armR = new THREE.Mesh(new THREE.CapsuleGeometry(0.08,0.4,4,8), armMat);
    armR.position.set(0.35,0.85,0.05);
    armR.rotation.z = typing? -0.4 : -0.15;
    g.add(armR);

    // blob shadow
    const blob = new THREE.Mesh(new THREE.CircleGeometry(0.4,16), new THREE.MeshBasicMaterial({color:0x000000, transparent:true, opacity:0.35}));
    blob.rotation.x = -Math.PI/2;
    blob.position.y = 0.01;
    g.add(blob);

    g.position.set(x, 0, z);
    g.rotation.y = rotY;
    g.userData.typing = typing;
    return g;
  }
  const agent1 = makeAgent(-1.4, 1.6, Math.PI, true);
  const agent2 = makeAgent(1.8, -1.4, -0.6, false);
  scene.add(agent1);
  scene.add(agent2);

  // ------ Hologram MIDAS label ------
  function makeLabelTexture(text){
    const c = document.createElement('canvas');
    c.width=512; c.height=128;
    const ctx = c.getContext('2d');
    ctx.clearRect(0,0,512,128);
    ctx.font = 'bold 72px Courier New';
    ctx.fillStyle = 'rgba(80,255,180,0.9)';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = '#4fffab';
    ctx.shadowBlur = 20;
    ctx.fillText(text, 256, 64);
    return new THREE.CanvasTexture(c);
  }
  const labelTex = makeLabelTexture('MIDAS');
  const labelMat = new THREE.SpriteMaterial({map: labelTex, transparent:true, depthWrite:false});
  const labelSprite = new THREE.Sprite(labelMat);
  labelSprite.scale.set(2.6,0.65,1);
  labelSprite.position.set(0, 2.6, 0);
  scene.add(labelSprite);

  // small ring under hologram
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.5,0.55,32), new THREE.MeshBasicMaterial({color:0x4fffab, transparent:true, opacity:0.4, side:THREE.DoubleSide}));
  ring.rotation.x = -Math.PI/2;
  ring.position.set(0,1.15,0);
  scene.add(ring);

  // ------ Props (12+) ------
  const props = new THREE.Group();

  // 1,2: office chairs
  function makeChair(x,z,rot){
    const c = new THREE.Group();
    const seat = new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.32,0.1,16), new THREE.MeshStandardMaterial({color:0x25211c, roughness:0.7}));
    seat.position.y = 0.55;
    c.add(seat);
    const back = new THREE.Mesh(new THREE.BoxGeometry(0.55,0.6,0.08), new THREE.MeshStandardMaterial({color:0x2a2419, roughness:0.7}));
    back.position.set(0,0.9,-0.3);
    c.add(back);
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.5,8), new THREE.MeshStandardMaterial({color:0x333333, metalness:0.6}));
    pole.position.y = 0.28;
    c.add(pole);
    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.3,0.04,16), new THREE.MeshStandardMaterial({color:0x1a1a1a}));
    base.position.y = 0.03;
    c.add(base);
    c.position.set(x,0,z);
    c.rotation.y = rot;
    return c;
  }
  props.add(makeChair(-1.4, 1.0, Math.PI));
  props.add(makeChair(1.8, -0.8, -0.6));

  // 3: plant
  function makePlant(x,z){
    const g = new THREE.Group();
    const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.24,0.4,12), new THREE.MeshStandardMaterial({color:0x5c4632, roughness:0.8}));
    pot.position.y = 0.2;
    g.add(pot);
    const leafMat = new THREE.MeshStandardMaterial({color:0x35573a, roughness:0.7});
    for(let i=0;i<6;i++){
      const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.12,0.7,6), leafMat);
      leaf.position.set(Math.cos(i)*0.12, 0.7+Math.random()*0.2, Math.sin(i)*0.12);
      leaf.rotation.z = (Math.random()-0.5)*0.6;
      leaf.rotation.x = (Math.random()-0.5)*0.6;
      g.add(leaf);
    }
    g.position.set(x,0,z);
    return g;
  }
  props.add(makePlant(-3.6,-3.4));

  // 4: floor lamp
  function makeLamp(x,z){
    const g = new THREE.Group();
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,1.6,8), new THREE.MeshStandardMaterial({color:0x8a6a3a, metalness:0.6, roughness:0.3}));
    pole.position.y = 0.8;
    g.add(pole);
    const shade = new THREE.Mesh(new THREE.ConeGeometry(0.28,0.4,16,1,true), new THREE.MeshStandardMaterial({color:0xffdca0, emissive:0xffb060, emissiveIntensity:0.6, side:THREE.DoubleSide}));
    shade.position.y = 1.65;
    g.add(shade);
    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.24,0.06,16), new THREE.MeshStandardMaterial({color:0x2a2a2a}));
    g.add(base);
    const lampLight = new THREE.PointLight(0xffb060, 0.7, 5);
    lampLight.position.y = 1.6;
    g.add(lampLight);
    g.position.set(x,0,z);
    return g;
  }
  props.add(makeLamp(-4.0, -1.0));

  // 5: bookshelf/books stack
  function makeBookStack(x,z){
    const g = new THREE.Group();
    const colors = [0x6b3b2a,0x2a4a3a,0x3a3060,0x7a5522];
    for(let i=0;i<4;i++){
      const b = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.09,0.35), new THREE.MeshStandardMaterial({color:colors[i], roughness:0.7}));
      b.position.set((Math.random()-0.5)*0.05, 0.05+i*0.1, (Math.random()-0.5)*0.03);
      b.rotation.y = (Math.random()-0.5)*0.15;
      g.add(b);
    }
    g.position.set(x,1.14,z);
    return g;
  }
  const books = makeBookStack(-1.9,-0.55);
  deskGroup.add(books);

  // 6: coffee cup
  function makeCoffee(x,y,z){
    const g = new THREE.Group();
    const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.07,0.12,12), new THREE.MeshStandardMaterial({color:0xe8e2d5, roughness:0.4}));
    g.add(cup);
    const liquid = new THREE.Mesh(new THREE.CylinderGeometry(0.065,0.065,0.02,12), new THREE.MeshStandardMaterial({color:0x2b1810}));
    liquid.position.y = 0.055;
    g.add(liquid);
    const handle = new THREE.Mesh(new THREE.TorusGeometry(0.05,0.015,8,12), new THREE.MeshStandardMaterial({color:0xe8e2d5}));
    handle.position.set(0.09,0,0);
    handle.rotation.y = Math.PI/2;
    g.add(handle);
    g.position.set(x,y,z);
    return g;
  }
  deskGroup.add(makeCoffee(1.9,1.14,-0.6));

  // 7: ticker tape (scrolling text plane, static texture)
  function makeTicker(){
    const c = document.createElement('canvas');
    c.width=1024; c.height=64;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#0a1410';
    ctx.fillRect(0,0,1024,64);
    ctx.font = '28px Courier New';
    ctx.fillStyle = '#4fffab';
    ctx.fillText('MDX +2.4%   ORB -0.8%   VLT +5.1%   FND +0.2%   KRX -1.1%   PLT +3.3%', 10, 40);
    return new THREE.CanvasTexture(c);
  }
  const tickerMat = new THREE.MeshStandardMaterial({map: makeTicker(), emissive:0x1c6b45, emissiveIntensity:0.7});
  const ticker = new THREE.Mesh(new THREE.PlaneGeometry(3.5,0.25), tickerMat);
  ticker.position.set(0, 2.2, -9.6);
  scene.add(ticker);

  // 8: wall clock
  function makeClock(x,y,z){
    const g = new THREE.Group();
    const face = new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.35,0.05,24), new THREE.MeshStandardMaterial({color:0xe8dcc0, roughness:0.5}));
    face.rotation.x = Math.PI/2;
    g.add(face);
    const rim = new THREE.Mesh(new THREE.TorusGeometry(0.35,0.03,8,24), new THREE.MeshStandardMaterial({color:0x8a6a3a, metalness:0.7}));
    g.add(rim);
    const hourHand = new THREE.Mesh(new THREE.BoxGeometry(0.02,0.15,0.02), new THREE.MeshStandardMaterial({color:0x222}));
    hourHand.position.set(0,0.05,0.03);
    g.add(hourHand);
    g.position.set(x,y,z);
    return g;
  }
  scene.add(makeClock(3.5,3.5,-9.65));

  // 9: railing (small barrier near desk edge)
  function makeRailing(x,z,len,rot){
    const g = new THREE.Group();
    const railMat = new THREE.MeshStandardMaterial({color:0x8a6a3a, metalness:0.6, roughness:0.3});
    const top = new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,len,8), railMat);
    top.rotation.z = Math.PI/2;
    top.position.y = 0.6;
    g.add(top);
    for(let i=-len/2;i<=len/2;i+=len/3){
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.015,0.015,0.6,8), railMat);
      post.position.set(i,0.3,0);
      g.add(post);
    }
    g.position.set(x,0,z);
    g.rotation.y = rot;
    return g;
  }
  props.add(makeRailing(0,-3.6,3,0));

  // 10: side table
  function makeSideTable(x,z){
    const g = new THREE.Group();
    const top = new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,0.06,16), new THREE.MeshStandardMaterial({color:0x3a2a1c, roughness:0.5}));
    top.position.y = 0.6;
    g.add(top);
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.6,8), new THREE.MeshStandardMaterial({color:0x241a12}));
    leg.position.y = 0.3;
    g.add(leg);
    g.position.set(x,0,z);
    return g;
  }
  const sideTable = makeSideTable(3.6,-2.4);
  props.add(sideTable);
  props.add(makeCoffee(3.6,0.65,-2.4));

  // 11: wall shelf with small decor
  function makeShelf(x,y,z){
    const g = new THREE.Group();
    const board = new THREE.Mesh(new THREE.BoxGeometry(1.6,0.06,0.3), new THREE.MeshStandardMaterial({color:0x3a2a1c}));
    g.add(board);
    for(let i=0;i<3;i++){
      const dec = new THREE.Mesh(new THREE.BoxGeometry(0.1,0.2,0.1), new THREE.MeshStandardMaterial({color:[0x5c2a2a,0x2a4a5c,0x4a5c2a][i]}));
      dec.position.set(-0.5+i*0.5, 0.13, 0);
      g.add(dec);
    }
    g.position.set(x,y,z);
    return g;
  }
  scene.add(makeShelf(-3.2, 2.6, -9.6));

  // 12: floor safe / small vault box (fits theme)
  function makeVault(x,z){
    const g = new THREE.Group();
    const box = new THREE.Mesh(new THREE.BoxGeometry(0.6,0.6,0.6), new THREE.MeshStandardMaterial({color:0x1c1c1c, roughness:0.4, metalness:0.5}));
    box.position.y = 0.3;
    g.add(box);
    const dial = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,0.03,16), new THREE.MeshStandardMaterial({color:0x8a6a3a, metalness:0.8}));
    dial.rotation.x = Math.PI/2;
    dial.position.set(0,0.3,0.32);
    g.add(dial);
    g.position.set(x,0,z);
    return g;
  }
  props.add(makeVault(3.8, 2.6));

  // 13: window-like wall panel with glow (fake window)
  const panelGlow = new THREE.Mesh(new THREE.PlaneGeometry(1.4,1.8), new THREE.MeshStandardMaterial({color:0x14261c, emissive:0x1c6b45, emissiveIntensity:0.3}));
  panelGlow.position.set(-6.5, 2.6, -9.7);
  scene.add(panelGlow);

  scene.add(props);

  // ------ Animation loop ------
  const clock = new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;

    handleInput(dt);
    updateCamera();

    // idle breathing
    agent2.position.y = Math.sin(t*1.2)*0.02;
    agent2.rotation.y += Math.sin(t*0.3)*0.0004;

    // typing motion
    agent1.children.forEach(c=>{});
    agent1.position.y = Math.sin(t*6)*0.005;

    // hologram bob
    labelSprite.position.y = 2.6 + Math.sin(t*1.5)*0.05;
    ring.rotation.z += dt*0.4;

    renderer.render(scene, camera);
  }
  animate();
})();
</script>
</body>
</html>
