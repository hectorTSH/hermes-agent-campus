# Non-secret reference settings. The local read-only adapter needs no credentials.

camera:
  view: elevated-three-quarter
  look_down_deg: 36
  strafe_inverted: true
  fov: 38
  pointer_lock: false

map:
  title: Campus
  locations:
    - Home
    - TSH
    - Folio Work Kits (DPF)
    - Midas
    - WanderPick
    - Agent Staff

agents:
  species_strategy: one-species-per-room
  name_tags: required
  downtime_zone: required
  role_stations: required

adapters:
  presence: hermes-local-readonly
  usage: coarse-live-band
  cron: hermes-local-readonly
  fail_closed: true
  # Set CAMPUS_LIVE_ADAPTER=0 in the process environment to disable collection.
  # The live endpoint is loopback-only; network clients receive fail-closed static state.
  # Never put tokens or keys in this file.
